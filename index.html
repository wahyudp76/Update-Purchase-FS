<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Order PR &amp; PO — Purchase Dashboard</title>
  <meta name="description" content="Dashboard monitor order bahan & spareparts: status PR/PO, approval, dan peringatan aging order. Auto-sync dari Google Sheets.">
  <meta name="theme-color" content="#4f46e5">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Order PR/PO">

  <!-- Favicon & icons (?v=2 = cache-bust, ganti angka bila ikon di-update lagi) -->
  <link rel="icon" href="icons/favicon.ico?v=2" sizes="48x48">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png?v=2">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
  <link rel="mask-icon" href="icons/icon.svg" color="#4f46e5">

  <!-- Windows tile -->
  <meta name="msapplication-TileColor" content="#4f46e5">
  <meta name="msapplication-TileImage" content="icons/mstile-150x150.png?v=2">
  <meta name="msapplication-config" content="browserconfig.xml">
  <style>
:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --line:#e7e9ee;
  --txt:#0f172a;
  --muted:#64748b;
  --accent:#4f46e5;
  --accent-2:#0ea5e9;
  --ok:#10b981;
  --warn:#f59e0b;
  --crit:#ef4444;
  --purple:#8b5cf6;
  --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.12);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--txt);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- Header ---------- */
header.top{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.header-inner{padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 14px -6px rgba(79,70,229,.55);
  overflow:hidden;
}
.brand h1{font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff}
.sync-pill .dot{width:8px;height:8px;border-radius:50%}
.sync-pill.wrap-on{white-space:nowrap}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.dot.off{background:var(--muted)}
.dot.load{background:var(--accent-2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--txt);
  border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn:hover{border-color:#c9cdd6;background:#fafbfc}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4338ca}
.btn svg{width:15px;height:15px}

/* ---------- Nav tabs ---------- */
nav.tabs{
  padding:0 22px;display:flex;gap:6px;overflow-x:auto;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);
  scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex;align-items:center;gap:8px;padding:12px 15px;
  font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;
  border-bottom:2.5px solid transparent;white-space:nowrap;transition:.15s;
}
.tab svg{width:16px;height:16px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- Layout ---------- */
main{padding:22px;max-width:1280px;margin:0 auto}
section.tab-page{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .spacer{flex:1}
.search{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:8px 12px;min-width:240px;
}
.search input{border:none;outline:none;font-size:13px;width:100%;background:none;color:var(--txt)}
select.select{
  border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;
  font-size:12.5px;font-weight:600;color:var(--txt);outline:none;
}

/* ---------- Cards & grid ---------- */
.grid{display:grid;gap:16px}
.cols-5{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cols-6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:15px;height:15px}
.kpi{position:relative;overflow:hidden}
.kpi .ic{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:#fff;margin-bottom:12px;
}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:6px}

/* ===== klik kategori → detail order (drill-down) ===== */
.kpi.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.kpi.clickable:hover{transform:translateY(-3px);border-color:#c7cbd6;box-shadow:0 14px 30px -16px rgba(15,23,42,.25)}
.kpi.clickable:active{transform:translateY(-1px)}
.kpi.clickable .see{position:absolute;right:12px;bottom:10px;font-size:10.5px;font-weight:700;color:var(--accent);opacity:.7;transition:.15s}
.kpi.clickable:hover .see{opacity:1}
.hbars div.clickable{cursor:pointer;border-radius:10px;padding:5px 7px;margin:-5px -7px;transition:background .12s}
.hbars div.clickable:hover{background:#f1f3fb}
.legend .row.clickable{cursor:pointer;border-radius:8px;padding:4px 7px;margin:-4px -7px;transition:background .12s}
.legend .row.clickable:hover{background:#f1f3fb}
.step{cursor:pointer;transition:transform .15s,box-shadow .15s}
.step:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(15,23,42,.3)}
.modal.wide{max-width:920px}
.drill-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.spark{position:absolute;right:-14px;top:-14px;opacity:.5;width:96px;height:96px}

/* ---------- Bars / donut ---------- */
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--txt)}
.hbar-label .hbar-val{font-weight:700;color:var(--muted)}
.hbar-track{height:8px;background:#eef0f4;border-radius:999px;overflow:hidden}
.hbar-fill{height:100%;border-radius:999px;transition:width .5s ease}
.flex-split{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:9px;min-width:150px}
.legend .row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend .sw{width:11px;height:11px;border-radius:3.5px;flex-shrink:0}
.legend .num{margin-left:auto;font-weight:700;color:var(--muted)}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px}
thead th{
  text-align:left;padding:11px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--accent)}
tbody td{padding:11px 13px;border-bottom:1px solid #f0f1f5;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8f9fc}
td.mono{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.cellitems{margin:0;padding-left:15px;display:flex;flex-direction:column;gap:2px}
.cellitems li{font-size:12.3px;line-height:1.4}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:#ecfdf5;color:#047857}
.badge.warn{background:#fffbeb;color:#b45309}
.badge.crit{background:#fef2f2;color:#b91c1c}
.badge.na{background:#f1f5f9;color:#64748b}
.badge.appr{background:#eef2ff;color:#4338ca}
.badge.appr-ok{background:#ecfdf5;color:#047857}
.badge.appr-no{background:#fef2f2;color:#b91c1c}
.badge.divi{background:#eef2ff;color:#4338ca}

/* ---------- Age accent ---------- */
.row-warn{background:#fffdf5!important}
.row-crit{background:#fef7f7!important}
tr.row-warn:hover{background:#fff8e6!important}
tr.row-crit:hover{background:#ffeded!important}

/* ---------- Status stepper ---------- */
.stepper{display:flex;flex-wrap:wrap;gap:10px}
.step{flex:1;min-width:150px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.step .num{font-size:22px;font-weight:800}
.step .cap{font-size:12px;color:var(--muted);margin-top:2px}
.step .bar{height:5px;border-radius:99px;background:#e8ebf0;margin-top:10px;overflow:hidden}
.step .bar .fill{height:100%;border-radius:99px}
.step.done{background:#f0fdf6;border-color:#bbf1d4}

/* ---------- Divisi cards ---------- */
.divi-card{cursor:pointer;transition:.15s;position:relative}
.divi-card:hover{transform:translateY(-3px);border-color:#c7cbd6;box-shadow:0 14px 30px -16px rgba(15,23,42,.25)}
.divi-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.divi-ava{width:40px;height:40px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.divi-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.divi-meta .m{background:#f8fafc;border-radius:10px;padding:9px 11px}
.divi-meta .m .t{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.divi-meta .m .v{font-size:16px;font-weight:800;margin-top:2px}

/* ---------- Empty / misc ---------- */
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.range-wrap{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;flex-wrap:wrap}
.range-wrap label{font-size:12px;font-weight:700;color:var(--muted)}
.num-in{width:74px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:700;color:var(--txt);background:#fff}
.num-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.mini{font-size:12px;color:var(--muted)}
.count-pill{font-size:12px;color:var(--muted);font-weight:600;padding:7px 12px;background:#fff;border:1px solid var(--line);border-radius:999px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{
  display:flex;align-items:center;gap:10px;margin:0 22px 12px;padding:11px 14px;
  border-radius:12px;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;
  font-size:13px;font-weight:600;
}
.banner .b-msg{flex:1}
.banner a{color:#b91c1c;text-decoration:underline}
.banner button{
  border:none;background:none;color:#b91c1c;font-size:17px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px;
}
.banner button:hover{background:#fee2e2}
@media(max-width:640px){.banner{margin:0 14px 10px}}

/* ---------- Action buttons (edit/delete) ---------- */
.btn-act{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.13s}
.btn-act:hover{transform:translateY(-1px)}
.btn-act svg{width:14px;height:14px}
.btn-act.edit:hover{color:var(--accent);border-color:var(--accent);background:#eef2ff}
.btn-act.del:hover{color:var(--crit);border-color:var(--crit);background:#fef2f2}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:70;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s ease}
.modal{background:#fff;border-radius:18px;box-shadow:0 24px 60px -20px rgba(15,23,42,.4);width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:15.5px;font-weight:800;letter-spacing:-.01em;flex:1}
.modal-close{border:none;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.modal-close:hover{background:#f1f5f9;color:var(--txt)}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.f-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.f-input,.f-textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;font-family:inherit;color:var(--txt);background:#fff;outline:none;transition:.13s}
.f-input:focus,.f-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.f-textarea{resize:vertical;min-height:96px;line-height:1.5}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-note{font-size:11.5px;color:var(--muted);line-height:1.5;background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 11px}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:9px;font-weight:700;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-sm.gh{background:#fff;border-color:var(--line);color:var(--txt)}
.btn-sm.gh:hover{background:#f8fafc}
.btn-sm.prim{background:var(--accent);color:#fff}
.btn-sm.prim:hover{background:#4338ca}
.btn-sm.danger{background:var(--crit);color:#fff}
.btn-sm.danger:hover{background:#dc2626}
.btn-sm:disabled{opacity:.55;cursor:not-allowed}
.modal-body.hide-fields > *:not(#modalNote){display:none}


@media(max-width:640px){
  .header-inner{padding:12px 14px}
  main{padding:14px}
  nav.tabs{padding:0 8px}
  .search{min-width:100%}
}
</style>
</head>
<body>

<header class="top">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">
          <defs>
            <linearGradient id="lgHdr" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4338ca"/><stop offset=".42" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/>
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="28" fill="url(#lgHdr)"/>
          <rect x="22" y="19.5" width="56" height="68" rx="6.2" fill="#ffffff"/>
          <rect x="38.5" y="11.8" width="23" height="13.7" rx="3.8" fill="#ffffff"/>
          <circle cx="50" cy="17.8" r="3.2" fill="#4338ca"/>
          <path d="M35.5 48.5 45.5 59.5 65.5 37.5" fill="none" stroke="#4338ca" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="35.5" y="66.5" width="29" height="4" rx="1.2" fill="#0ea5e9"/>
          <rect x="35.5" y="74.5" width="19" height="4" rx="1.2" fill="#0ea5e9"/>
        </svg>
      </div>
      <div>
        <h1>Monitor Order PR &amp; PO</h1>
        <div class="sub">Bahan &amp; Spareparts · Sheet "Response" · Auto-sync</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="sync-pill" id="syncPill"><span class="dot load" id="syncDot"></span><span id="syncText">Memuat…</span></span>
      <label class="sync-pill wrap-on" style="cursor:pointer" title="Auto sync tiap 5 menit">
        <input type="checkbox" id="autoSync" checked style="accent-color:var(--accent)"> Auto-sync 5 menit
      </label>
      <button class="btn" id="refreshBtn" title="Ambil data terbaru dari spreadsheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Refresh
      </button>
      <button class="btn" id="installBtn" style="display:none" title="Pasang dashboard ini sebagai aplikasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        Install App
      </button>
      <button class="btn primary" id="addBtn" title="Tambah order baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Tambah
      </button>
      <button class="btn primary" id="exportBtn" title="Export data terfilter ke CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        Export CSV
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabsNav"></nav>
</header>

  <div class="banner" id="syncBanner" style="display:none">
    <span>⚠</span>
    <span class="b-msg" id="syncBannerMsg"></span>
    <button id="syncBannerClose" title="Tutup">×</button>
  </div>
  <main id="main"></main>
  <div class="toast" id="toast"></div>
  <div class="modal-back" id="modalBack" style="display:none">
    <div class="modal" id="modalBox">
      <div class="modal-head">
        <h2 id="modalTitle">Tambah Order</h2>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body" id="modalBody">
        <div class="f-note" id="modalNote" style="display:none"></div>
        <!-- Urutan, tipe, opsi & field wajib sama dengan Google Form "Update PR & PO FS" -->
        <div class="f-row">
          <div><label class="f-label">Tanggal Input Reservasi (dd/mm/yyyy) *</label><input class="f-input" id="fTgl" placeholder="23/09/2026"></div>
          <div><label class="f-label">Divisi *</label>
            <select class="f-input" id="fDivisi">
              <option value="">— Pilih Divisi —</option>
              <option value="PG2">PG2</option>
              <option value="FM4">FM4</option>
              <option value="OP2">OP2</option>
            </select>
          </div>
        </div>
        <div><label class="f-label">Keperluan Order *</label>

(function(){

/* Snapshot offline (fallback saat preview tanpa jaringan) — diperbarui manual bila perlu
   Kolom: Timestamp, Tanggal, Divisi, Jenis Order, PR, PO, Approval1, Approval2, Keterangan, Keperluan, Status Kedatangan */
var SNAPSHOT = [
  ["25/09/2026 10:34:52","29/07/2026","PG2","BUSHING RUBBER;F/BAUT FCL200 8 pcs","1300199595","4400258966","Sudah","Sudah","","Spareparts Engine","Belum"],
  ["23/09/2026 14:45:35","23/09/2026","OP2","- Ember plastik besar 15 pcs\n- Golok tebang biasa 15 pcs\n- Cangkul + gagang 15 pcs\n- Terpal hijau 4x6 15 pcs","1300203795","","Sudah","Belum","Untuk keperluan tenaga kerja irigasi","Kantor","Belum"],
  ["23/09/2026 14:47:19","23/09/2026","OP2","- Selang dobel elpiji / oksigen 6,5mm - 8mm 50 meter","1300203795","","Belum","Belum","Untuk cuci steam mesin irigasi","Kantor","Belum"]
];

/* Dedupe: buang baris yang isinya 100% sama (duplikat dari form/import) */
function dedupeRows(rows){

/* ============ STATE ============ */

var state = { tab:'overview', q:'', divFilter:'all', stFilter:'all', warnTh:7, critTh:14, sortKey:'age', sortDir:-1, exportRows:[], showArrivedAging:false };

var TABS = [

];

var DIVI_COLORS = ['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#64748b'];
var FLOW_COLORS = {'Selesai':'#10b981','Menunggu Approval':'#f59e0b','Belum PO':'#ef4444'};
/* Status Kedatangan (kolom baru di spreadsheet) */
function arrivalInfo(v){
  var s = String(v==null?'':v).trim();
  var low = s.toLowerCase();
  if(!s) return { label:'Belum Diisi', key:'kosong', color:'#64748b', raw:'' };
  if(/(sudah|datang|tiba|sampai|received|diterima|arrived)/.test(low)) return { label:'Sudah', key:'sudah', color:'#10b981', raw:s };
  if(/(batal|cancel)/.test(low)) return { label:s, key:'batal', color:'#ef4444', raw:s };
  if(/(sebagian|partial)/.test(low)) return { label:'Sebagian', key:'sebagian', color:'#8b5cf6', raw:s };
  if(/(belum|proses|menunggu|pending|diproses|dalam perjalanan|on ?going|otw)/.test(low)) return { label:s, key:'proses', color:'#f59e0b', raw:s };
  return { label:s, key:'lain', color:'#0ea5e9', raw:s };
}

/* ============ UTIL ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var _nfmt = null;
function nf(n){ if(!_nfmt) _nfmt = new Intl.NumberFormat('id-ID'); return _nfmt.format(n||0); }
function parseDMY(s){
  if(!s) return null;
  var m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}
function daysAgo(d){
  if(!d) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.max(0, Math.round((t - d)/86400000));
}
function isOK(v){
  var s = String(v==null?'':v).toLowerCase();
  if(!s) return false;
  return /ok|approve|approved|setuju|yes|sudah|selesai|done|agree/.test(s);
}
function parseItems(txt){
  if(!txt) return [];
  return String(txt).split(/\r?\n/).map(function(l){ return l.replace(/^[-•*·]\s*/, '').replace(/^\d+[.)]\s*/,'').trim(); }).filter(Boolean);
}
function splitQty(line){
  if(!line) return {name:'', qty:0, unit:''};
  var m = line.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*([a-zA-Z]+)?\s*$/);
  if(m) return {name:m[1].trim(), qty:parseFloat(m[2].replace(',','.')), unit:(m[3]||'').trim()};
  return {name:line.trim(), qty:1, unit:''};
}
function monthKey(d){ return d ? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0') : ''; }
function monthLabel(k){
  var p = k.split('-'); var names=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return names[+p[1]-1]+' '+p[0];
}

/* ============ NORMALIZE ============ */
function normalize(raw){
  /* lookup case-insensitive: kunci kolom dari gviz memakai huruf kapital (mis. "Nomor PR") */
  var map = {};
  Object.keys(raw || {}).forEach(function(k){ map[String(k).toLowerCase()] = raw[k]; });
  var get = function(label){
    var v = map[String(label).toLowerCase()];
    return (v==null || v==='') ? '' : String(v).trim();
  };
  var ts = get('Timestamp');
  var tgl = get('Tanggal Input Reservasi');
  var divisi = get('Divisi') || 'Tanpa Divisi';
  var jenis = get('Jenis Order');
  var pr = get('Nomor PR');
  var po = get('Nomor PO');
  var a1 = get('Approval 1');
  var a2 = get('Approval 2');
  var ket = get('Keterangan');
  var keperluan = get('Keperluan Order') || '—';
  var arrivalRaw = get('Status Kedatangan');

  var items = parseItems(jenis);
  var dateObj = parseDMY(tgl) || parseDMY(ts);
  var age = dateObj ? daysAgo(dateObj) : null;
  var hasPO = po !== '';
  var appr1 = isOK(a1), appr2 = isOK(a2);
  /* flow = alur proses PR/PO/approval (dipertahankan utk tab Status & Approval) */
  var flow = !hasPO ? 'Belum PO' : (!appr1 || !appr2) ? 'Menunggu Approval' : 'Selesai';
  var progress = [hasPO, appr1, appr2].filter(Boolean).length;
  var arr = arrivalInfo(arrivalRaw);

  return {
    raw: raw,
    ts: ts, tgl: tgl, divisi: divisi, jenis: jenis, pr: pr, po: po,
    a1: a1, a2: a2, ket: ket, keperluan: keperluan,
    items: items, hasPO: hasPO, appr1: appr1, appr2: appr2,
    status: arr.label, statusKey: arr.key, statusColor: arr.color, arrivalRaw: arrivalRaw,
    flow: flow, flowKey: !hasPO ? 'nopo' : (!appr1 || !appr2) ? 'wait' : 'done',
    progress: progress,
    date: dateObj, age: age, mkey: monthKey(dateObj)
  };
}

/* ============ FETCH ============ */
function loadFromSnapshot(){
  return SNAPSHOT.map(function(r){
    return normalize({
      'Timestamp':r[0], 'Tanggal Input Reservasi':r[1], 'Divisi':r[2], 'Jenis Order':r[3],
      'Nomor PR':r[4], 'Nomor PO':r[5], 'Approval 1':r[6], 'Approval 2':r[7],
      'Keterangan':r[8], 'Keperluan Order':r[9], 'Status Kedatangan':r[10]
    });
  });
}

function fetchWithTimeout(url, opts, ms, timeoutMsg){
  /* fetch + batas waktu: koneksi menggantung tidak mengunci UI selamanya */
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, ms) : null;
  var p = fetch(url, ctrl ? Object.assign({}, opts || {}, { signal: ctrl.signal }) : opts);
  if(ctrl){
    p = p.catch(function(err){
      if(err && (err.name === 'AbortError' || /abort/i.test(String(err)))) throw new Error(timeoutMsg);
      throw err;
    }).finally(function(){ clearTimeout(timer); });
  }
  return p;
}

function loadLive(urlOverride){
  var url = urlOverride || GVURL;
  return fetchWithTimeout(url, {cache:'no-store'}, 20000, 'Waktu tunggu sync habis (20 dtk)').then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.text();
  }).then(function(text){
    var start = text.indexOf('{');
    var end = text.lastIndexOf('}');
    if(start<0 || end<0) throw new Error('Format tidak dikenali');
    var data = JSON.parse(text.slice(start, end+1));
    if(data.status !== 'ok') throw new Error('status '+data.status);
    var cols = data.table.cols.map(function(c){ return c.label; });
    return data.table.rows.map(function(r, ri){
      var o = {};
      r.c.forEach(function(cell, i){
        var v = '';
        if(cell){
          if(cell.f != null) v = cell.f;
          else if(cell.v != null) v = cell.v;
          else v = '';
        }
        o[cols[i]] = v;
      });
      /* nomor baris sheet (1-based) untuk identitas aksi edit/hapus */
      o['No Row ID'] = String(ri + 2);
      return o;
    });
  }).then(function(rawRows){
    return rawRows.map(normalize);
  });
}

var DUPDROP = 0;
function setRows(rows, live, err){
  var all = rows || [];
  var clean = dedupeRows(all);
  DUPDROP = all.length - clean.length;
  ROWS = clean;
  LIVE = !!(live && !err);
  LAST_SYNC = new Date();
  updateSyncPill(err);
  if(!err && live && typeof hideSyncBanner === 'function') hideSyncBanner();
  render();
}

function updateSyncPill(err){
  var dot = document.getElementById('syncDot');
  var txt = document.getElementById('syncText');
  if(err){
    dot.className = 'dot off';
    txt.textContent = 'Gagal sync';
    txt.title = 'Gagal: ' + err + ' — menampilkan snapshot offline. Pastikan spreadsheet masih dibagikan (Share → Anyone with the link → Viewer).';
  } else if(LIVE){
    dot.className = 'dot on';
    txt.textContent = 'Tersinkron · ' + timeStr(LAST_SYNC) + (DUPDROP>0 ? ' · '+DUPDROP+' duplikat diabaikan' : '');
    txt.title = 'Terhubung ke spreadsheet. Terakhir sync: ' + LAST_SYNC.toLocaleString('id-ID') + '. ' + ROWS.length + ' baris unik ditampilkan' + (DUPDROP>0 ? ' (' + DUPDROP + ' baris duplikat diabaikan).' : '.');
  } else {
    dot.className = 'dot off';
    txt.textContent = 'Offline (snapshot)';
    txt.title = 'Tidak ada jaringan di preview ini. Dashboard tetap tampil dengan snapshot data.';
  }
}
function timeStr(d){ if(!d) return ''; return d.toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'}); }

/* identitas baris untuk aksi edit/hapus (unik per baris di spreadsheet) */
function rowKey(r){
  var k = String(r.raw['No Row ID'] || '').trim();
  if(k) return k;
  return uniq(['PR:'+r.pr, 'PO:'+r.po, 'Div:'+r.divisi, 'Jns:'+r.jenis]);
}
function uniq(ps){
  var s = 0;
  var full = ps.join('|');
  for(var i=0;i<full.length;i++){ s = ((s<<5)-s) + full.charCodeAt(i); s |= 0; }
  return 'k' + (s>>>0).toString(36);
}

var SYNC_BUSY = false;
function bindRetryLink(){
  var rl = document.getElementById('retryLink');
  if(rl) rl.addEventListener('click', function(){ hideSyncBanner(); refresh(); });
}
async function refresh(){
  if(SYNC_BUSY) return; /* anti-race: klik manual + auto-sync + refresh setelah simpan */
  SYNC_BUSY = true;
  var btn = document.getElementById('refreshBtn');
  var dot = document.getElementById('syncDot'); dot.className='dot load';
  var txt = document.getElementById('syncText'); txt.textContent='Memuat…';
  btn.disabled = true;
  try{
    /* cache-bust: params unik tiap request agar hasil selalu segar */
    var url = GVURL + '&_cb=' + Date.now();
    var rows = await loadLive(url);
    SYNC_ERROR = null;
    setRows(rows, true, null);
    toast('Sinkron sukses · '+ROWS.length+' baris'+ (DUPDROP>0?', '+DUPDROP+' duplikat diabaikan':'') +' · '+timeStr(LAST_SYNC));
  }catch(e){
    SYNC_ERROR = String(e && e.message || e);
    if(ROWS.length){
      /* sudah pernah dapat data valid → PERTAHANKAN data terakhir, jangan turun ke snapshot lama */
      LIVE = false;
      updateSyncPill(SYNC_ERROR);
      showSyncBanner('Sinkron gagal: <b>'+esc(SYNC_ERROR)+'</b>. Menampilkan <b>data terakhir yang tersinkron</b>. <a href="javascript:void(0)" id="retryLink">Coba lagi</a>.');
      bindRetryLink();
      toast('Gagal sync — menampilkan data terakhir ('+timeStr(LAST_SYNC)+')');
    }else{
      setRows(loadFromSnapshot(), false, SYNC_ERROR);
      toast('Gagal sinkron: '+SYNC_ERROR);
      showSyncBanner('Sinkron gagal: <b>'+esc(SYNC_ERROR)+'</b>. Dashboard menampilkan snapshot offline. Pastikan spreadsheet masih dibagikan — Share → "Anyone with the link" → Viewer. <a href="javascript:void(0)" id="retryLink">Coba lagi</a>.');
      bindRetryLink();
    }
  }finally{
    SYNC_BUSY = false;
    btn.disabled = false;
  }
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

function showSyncBanner(msg){
  var b = document.getElementById('syncBanner');
  var m = document.getElementById('syncBannerMsg');
  if(!b || !m) return;
  m.innerHTML = msg;
  b.style.display = 'flex';
}
function hideSyncBanner(){
  var b = document.getElementById('syncBanner');
  if(b) b.style.display = 'none';
}

/* ============ WRITE-BACK via Google Apps Script ============ */
/* URL web app Apps Script. Set lewat konstanta di bawah ATAU param URL:
   ?scriptUrl=https://script.google.com/macros/s/XXXX/exec */
var DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvSPofaWIN1YkIp8tRxxmHmy2kzfkxOoirdXH7lWcRLZKzGDiA0Lz9Oe3ySaJheJf4/exec';

  try{ return new URLSearchParams(location.search).get('scriptUrl') || DEFAULT_SCRIPT_URL; }catch(e){ return DEFAULT_SCRIPT_URL; }
})();

function scriptConfigured(){ return !!SCRIPT_URL; }
function scriptHint(){
  return 'URL Apps Script belum diset. Lihat cara deploy di README, lalu isi variabel SCRIPT_URL '
    + 'di index.html ATAU buka dashboard dengan param ?scriptUrl=https://script.google.com/macros/s/.../exec';
}

function callScript(action, rowId, values){
  if(!SCRIPT_URL){
    return Promise.reject(new Error(scriptHint()));
  }
  return fetchWithTimeout(SCRIPT_URL, {
    method:'POST',
    /* text/plain wajib: membuat request jadi "simple request" (tanpa preflight CORS) */
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ sheetId: SHEET_ID, sheetName: SHEET_NAME, action: action, rowId: rowId, values: values || {} })
  }, 30000, 'Server Apps Script tidak merespons (30 dtk)').then(function(r){ return r.text(); }).then(function(t){
    var j = null;
    try{ j = JSON.parse(t); }catch(e){ throw new Error('Respons bukan JSON: ' + String(t).slice(0,140)); }
    if(j && j.ok) return j;
    throw new Error((j && j.error) ? j.error : 'Gagal (tanpa pesan dari server)');
  });
}

/* ============ DERIVED ============ */
function agingClass(r){
  /* barang sudah datang → bukan aging/warning lagi */
  if(r.statusKey==='sudah') return 'arrived';
  if(r.age == null) return 'na';
  if(r.age >= state.critTh) return 'crit';
  if(r.age >= state.warnTh) return 'warn';
  return 'ok';
}
function agingBadge(r){
  var cls = agingClass(r);
  if(cls==='arrived') return '<span class="badge ok"><span class="dot"></span>'+(r.age!=null? r.age+' hr · ' : '')+'selesai</span>';
  if(cls==='crit') return '<span class="badge crit"><span class="dot"></span>'+r.age+' hr · kritis</span>';
  if(cls==='warn') return '<span class="badge warn"><span class="dot"></span>'+r.age+' hr · warning</span>';
  if(cls==='na')  return '<span class="badge na">—</span>';
  return '<span class="badge ok"><span class="dot"></span>'+r.age+' hr</span>';
}
function statusBadge(r){
  var c = r.statusColor || '#64748b';
  return '<span class="badge" style="background:'+hexA(c,0.14)+';color:'+c+'"><span class="dot"></span>'+esc(r.status || '—')+'</span>';
}
function flowBadge(r){
  var c = FLOW_COLORS[r.flow] || '#64748b';
  return '<span class="badge" style="background:'+hexA(c,0.14)+';color:'+c+'"><span class="dot"></span>'+esc(r.flow)+'</span>';
}
function apprBadge(val, ok){
  if(ok) return '<span class="badge appr-ok">✓ '+esc(val || 'OK')+'</span>';
  return '<span class="badge appr-no">'+esc(val || '— belum —')+'</span>';
}
function hexA(hex, a){
  var h = hex.replace('#','');
  var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function divisiColor(d){

}

function hbar(items, opts){
  opts = opts || {};
  if(!items.length) return '<div class="empty">Belum ada data</div>';
  var max = 1;
  items.forEach(function(i){ max = Math.max(max, i.value); });
  return '<div class="hbars">' + items.map(function(i){
    var pct = (i.value/max*100).toFixed(1);
    return '<div'+(i.drill?' class="clickable" data-drill="'+esc(i.drill)+'" role="button" tabindex="0" title="Klik untuk melihat order"':'')+'>'
      + '<div class="hbar-label"><span>'+esc(i.label)+'</span><span class="hbar-val">'+nf(i.value)+(opts.unit||'')+'</span></div>'
      + '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+i.color+'"></div></div>'
      + '</div>';
  }).join('') + '</div>';
}

function donut(parts, size){
  var total = 0; parts.forEach(function(p){ total += p.value; });
  if(!total) return '<div class="empty">Belum ada data</div>';
  var r = size/2, c = size/2;
  var a0 = -Math.PI/2, segs = '';
  parts.forEach(function(p){
    var frac = p.value/total;
    var a1 = a0 + frac*Math.PI*2;
    var x0 = c + r*Math.cos(a0), y0 = c + r*Math.sin(a0);
    var x1 = c + r*Math.cos(a1), y1 = c + r*Math.sin(a1);
    var large = frac > 0.5 ? 1 : 0;
    segs += '<path d="M'+c+' '+c+' L'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+' Z" fill="'+p.color+'"/>';
    a0 = a1;
  });
  var lg = '<div class="legend">' + parts.map(function(p){
    var pct = Math.round(p.value/total*1000)/10;
    return '<div class="row'+(p.drill?' clickable':'')+'"'+(p.drill?' data-drill="'+esc(p.drill)+'" role="button" tabindex="0" title="Klik untuk melihat order"':'')+'><span class="sw" style="background:'+p.color+'"></span>'+esc(p.label)+'<span class="num">'+nf(p.value)+' · '+pct+'%</span></div>';
  }).join('') + '</div>';
  var svg = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+segs+'<circle cx="'+c+'" cy="'+c+'" r="'+(r*0.62)+'" fill="#fff"/><text x="'+c+'" y="'+(c-4)+'" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">'+nf(total)+'</text><text x="'+c+'" y="'+(c+14)+'" text-anchor="middle" font-size="10.5" fill="#64748b">order</text></svg>';
  return '<div class="flex-split">'+svg+lg+'</div>';
}

function lineChart(points){
  if(!points.length) return '<div class="empty">Belum ada data</div>';
  var w = 640, h = 210, pad = 30;
  var max = 1; points.forEach(function(p){ max = Math.max(max, p.value); });
  var n = points.length;
  var x = function(i){ return n===1 ? w/2 : pad + i*(w-2*pad)/(n-1); };
  var y = function(v){ return h - pad - (v/max)*(h-2*pad); };
  var pts = points.map(function(p,i){ return x(i).toFixed(1)+','+y(p.value).toFixed(1); });
  var area = pad.toFixed(1)+','+(h-pad)+' ' + pts.join(' ') + ' ' + x(n-1).toFixed(1)+','+(h-pad);
  var dots = points.map(function(p,i){
    return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="3.6" fill="#4f46e5" stroke="#fff" stroke-width="2"/>';
  }).join('');
  var labels = points.map(function(p,i){
    return '<text x="'+x(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10.5" fill="#64748b">'+esc(monthLabel(p.label))+'</text>';
  }).join('');
  var vals = points.map(function(p,i){
    return '<text x="'+x(i).toFixed(1)+'" y="'+(y(p.value)-8)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">'+nf(p.value)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'
    + '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f46e5" stop-opacity=".25"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></linearGradient></defs>'
    + '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#e7e9ee"/>'
    + '<polygon points="'+area+'" fill="url(#ag)"/>'
    + '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots + labels + vals
    + '</svg>';
}

function statusGroups(){
  /* kelompokkan per Status Kedatangan; pertahankan urutan konsisten */
  var order = [];
  ROWS.forEach(function(r){
    var key = r.statusKey;
    if(!key) key = 'kosong';
    if(!order.some(function(o){ return o.key===key; })) order.push({ key:key, label:r.status, color:r.statusColor });
  });
  var counts = {};
  ROWS.forEach(function(r){ counts[r.statusKey] = (counts[r.statusKey]||0)+1; });
  return order.map(function(o){ return { key:o.key, label:o.label, value:counts[o.key]||0, color:o.color }; });
}

function renderOverview(){
  var total = ROWS.length;
  var withPO = ROWS.filter(function(r){ return r.hasPO; }).length;
  var noPO = ROWS.filter(function(r){ return !r.hasPO; }).length;
  var apprPending = ROWS.filter(function(r){ return !r.appr1 || !r.appr2; }).length;
  var done = ROWS.filter(function(r){ return r.flowKey==='done'; }).length;
  var arrived = ROWS.filter(function(r){ return r.statusKey==='sudah'; }).length;
  var pendingArr = ROWS.filter(function(r){ return r.statusKey!=='sudah'; }).length;
  var itemLines = 0, qtyTotal = 0;
  ROWS.forEach(function(r){ r.items.forEach(function(it){ itemLines++; qtyTotal += splitQty(it).qty; }); });
  var warnCount = ROWS.filter(function(r){ var c=agingClass(r); return c==='warn'||c==='crit'; }).length;
  var critCount = ROWS.filter(function(r){ return agingClass(r)==='crit'; }).length;

  /* per divisi */
  var byD = {}; ROWS.forEach(function(r){ byD[r.divisi]=(byD[r.divisi]||0)+1; });
  var divBars = Object.keys(byD).sort(function(a,b){return byD[b]-byD[a];}).map(function(d){
    return {label:d, value:byD[d], color:divisiColor(d), drill:'div:'+d};
  });

  /* status kedatangan (kolom baru) */
  var sParts = statusGroups();
  sParts.forEach(function(p){ p.drill = 'stv:'+p.key; });

  /* per status kedatangan per divisi */
  var arrByDiv = divisiList().map(function(d){
    var rs = ROWS.filter(function(r){ return r.divisi===d; });
    var arrivedD = rs.filter(function(r){ return r.statusKey==='sudah'; }).length;
    var tot = rs.length;
    return { label:d, value:tot, arrived:arrivedD, color:divisiColor(d) };
  });

  /* trend bulanan */
  var byM = {}; ROWS.forEach(function(r){ if(r.mkey){ byM[r.mkey]=(byM[r.mkey]||0)+1; } });
  var trend = Object.keys(byM).sort().map(function(k){ return {label:k, value:byM[k]}; });

  /* top items */
  var itemCount = {}; ROWS.forEach(function(r){ r.items.forEach(function(it){ var q=splitQty(it); var n=q.name.toLowerCase(); itemCount[n]=(itemCount[n]||0)+1; }); });
  var topItems = Object.keys(itemCount).map(function(n){return {label:n, value:itemCount[n]};}).sort(function(a,b){return b.value-a.value;}).slice(0,6);
  topItems.forEach(function(t,i){ t.color = ['#4f46e5','#0ea5e9','#10b981','#f59e0b','#8b5cf6','#ec4899'][i%6]; t.drill = 'item:'+t.label; });

    return '<div style="margin-bottom:12px"><div class="hbar-label"><span>'+esc(d.label)+'</span><span class="hbar-val">'+nf(d.arrived)+'/'+nf(d.value)+' datang</span></div>'
      + '<div style="display:flex;height:9px;border-radius:99px;overflow:hidden;background:#eef0f4">'
      + (d.arrived>0 ? '<div style="width:'+pct+'%;background:#10b981"></div>' : '')
      + (d.value-d.arrived>0 ? '<div style="width:'+(100-pct)+'%;background:#f59e0b"></div>' : '')
      + '</div></div>';
  }).join('');

  return '<section class="tab-page">'
    + '<div class="toolbar"><span class="count-pill">'+nf(total)+' order tercatat · terakhir sync '+(LAST_SYNC?LAST_SYNC.toLocaleString('id-ID'):'—')+'</span><span class="spacer"></span><span class="mini">Auto-refresh 5 menit · klik kartu kategori / legenda / bar untuk detail order</span></div>'
    + '<div class="grid cols-6">'
    + kpi(IC.docs, nf(total), 'Total Order (PR)', 'jumlah baris order masuk', '#4f46e5', 'ov-all')
    + kpi(IC.box, nf(withPO), 'PO Dibuat', 'order yang sudah ada Nomor PO', '#0ea5e9', 'ov-po')
    + kpi(IC.alert, nf(noPO), 'Belum Ada PO', 'nomor PO belum dibuat', '#ef4444', 'ov-nopo')
    + kpi(IC.clock, nf(apprPending), 'Approval Belum Lengkap', 'approval 1 / 2 belum lengkap', '#f59e0b', 'ov-waitappr')
    + kpi(IC.check, nf(arrived), 'Sudah Datang', 'Status Kedatangan = Sudah', '#10b981', 'ov-arrived')
    + kpi(IC.alert, nf(warnCount), 'Warning Aging', critCount+' kritis · ambang '+state.warnTh+'&ndash;'+state.critTh+' hari', '#ef4444', 'ov-warn')
    + '</div>'
    + '<div class="grid cols-2" style="margin-top:16px">'
    + '<div class="card"><h3><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/></svg>Status Kedatangan</h3>'+donut(sParts, 168)+'</div>'
    + '<div class="card"><h3><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg>Order per Divisi</h3>'+hbar(divBars)+'</div>'
    + '</div>'
    + '<div class="grid cols-2" style="margin-top:16px">'
    + '<div class="card"><h3><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 6-8"/><path d="M14 7h4v4"/></svg>Tren Order per Bulan</h3>'+lineChart(trend)+'</div>'

    + '<p class="hint">Hijau = sudah datang · Kuning = belum/proses. Berdasarkan kolom "Status Kedatangan" di sheet.</p></div>'
    + '</section>';

function divisiStatusBars(list){
  var html = '<div class="hbars">';
  list.forEach(function(d){
    var rs = ROWS.filter(function(r){ return r.divisi===d; });
    var arrived = rs.filter(function(r){ return r.statusKey==='sudah'; }).length;
    var notArrived = rs.length - arrived;
    var tot = rs.length || 1;
    html += '<div style="margin-bottom:12px"><div class="hbar-label"><span>'+esc(d)+'</span><span class="hbar-val">'+nf(rs.length)+'</span></div>';
    html += '<div style="display:flex;height:9px;border-radius:99px;overflow:hidden;gap:2px;background:#eef0f4">';
    if(arrived) html += '<div style="width:'+(arrived/tot*100)+'%;background:#10b981" title="Sudah datang '+arrived+'"></div>';
    if(notArrived) html += '<div style="width:'+(notArrived/tot*100)+'%;background:#f59e0b" title="Belum datang '+notArrived+'"></div>';
    html += '</div>'
      + '<div style="display:flex;gap:12px;margin-top:5px;font-size:11px;color:var(--muted)">'
      + '<span><span style="color:#10b981">●</span> Sudah datang '+arrived+'</span>'
      + '<span><span style="color:#f59e0b">●</span> Belum datang '+notArrived+'</span>'
      + '</div></div>';
  });
  html += '</div>';
  return html;
}

function renderStatus(){
  var noPO = ROWS.filter(function(r){ return !r.hasPO; }).length;
  var waitAppr = ROWS.filter(function(r){ return r.hasPO && r.flowKey==='wait'; }).length;
  var done = ROWS.filter(function(r){ return r.flowKey==='done'; }).length;
  var arrived = ROWS.filter(function(r){ return r.statusKey==='sudah'; }).length;
  var notArrived = ROWS.filter(function(r){ return r.statusKey!=='sudah'; }).length;
  var a1ok = ROWS.filter(function(r){ return r.appr1; }).length;
  var a2ok = ROWS.filter(function(r){ return r.appr2; }).length;
  var total = ROWS.length || 1;

  /* baris yang perlu perhatian: approval belum lengkap */
  var pending = ROWS.filter(function(r){ return r.flowKey!=='done'; }).slice().sort(function(a,b){ return (b.age||0)-(a.age||0); });

  var pendingRows = pending.length ? pending.map(function(r){
    var ac = agingClass(r);
    var cls = ac==='crit' ? 'row-crit' : (ac==='warn' ? 'row-warn' : '');
    return '<tr class="'+cls+'">'
      + '<td class="mono">'+(r.tgl?esc(r.tgl):'—')+'</td>'
      + '<td><span class="badge divi">'+esc(r.divisi)+'</span></td>'
      + '<td class="mono">'+(r.pr?esc(r.pr):'—')+'</td>'
      + '<td class="mono">'+(r.po?esc(r.po):'<span class="badge crit">tanpa PO</span>')+'</td>'
      + '<td>'+apprBadge(r.a1, r.appr1)+'</td>'
      + '<td>'+apprBadge(r.a2, r.appr2)+'</td>'
      + '<td>'+flowBadge(r)+'</td>'
      + '<td>'+statusBadge(r)+'</td>'
      + '<td>'+agingBadge(r)+'</td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="9"><div class="empty">Semua order sudah memiliki PO & approval lengkap ✓</div></td></tr>';

  var steps = [
    {cap:'PR Dibuat', done:total, n:total, color:'#4f46e5', drill:'ov-all'},
    {cap:'PO Dibuat', n:ROWS.filter(function(r){return r.hasPO;}).length, color:'#0ea5e9', drill:'ov-po'},
    {cap:'Approval 1', n:a1ok, color:'#8b5cf6', drill:'ap-a1'},
    {cap:'Approval 2', n:a2ok, color:'#10b981', drill:'ap-a2'}
  ];
  var stepper = steps.map(function(s, i){
    var pct = Math.round(s.n/total*100);
    var cls = pct===100 ? ' done' : '';
    return '<div class="step'+cls+'"'+(s.drill?' data-drill="'+s.drill+'" role="button" tabindex="0" title="Klik untuk melihat order"':'')+'><div class="num">'+ (i===0? nf(total) : nf(s.n)) +'</div><div class="cap">'+s.cap+'</div><div class="bar"><div class="fill" style="width:'+pct+'%;background:'+s.color+'"></div></div></div>';
  }).join('');

  return '<section class="tab-page">'
    + '<div class="toolbar"><span class="count-pill">'+nf(total)+' order · '+nf(pending.length)+' perlu tindak lanjut (tanpa PO / approval belum)</span><span class="spacer"></span><span class="mini">Status Kedatangan: '+nf(arrived)+' sudah · '+nf(notArrived)+' belum</span></div>'
    + '<div class="card" style="margin-bottom:16px"><h3><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>Alur Proses (Pipeline)</h3><div class="stepper">'+stepper+'</div></div>'
    + '<div class="grid cols-3" style="margin-bottom:16px">'
    + kpi(IC.check, nf(done), 'Approval Lengkap', 'Approval 1 & 2 lengkap', '#10b981', 'st-done')
    + kpi(IC.clock, nf(waitAppr), 'Menunggu Approval', 'PO ada, approval belum lengkap', '#f59e0b', 'st-wait')
    + kpi(IC.alert, nf(noPO), 'Belum Ada PO', 'Nomor PO belum dibuat', '#ef4444', 'st-nopo')
    + '</div>'
    + '<div class="grid cols-2" style="margin-bottom:16px">'
    + kpi(IC.check, nf(arrived), 'Sudah Datang', 'Status Kedatangan = Sudah', '#10b981', 'st-arr')
    + kpi(IC.clock, nf(notArrived), 'Belum Datang', 'Status Kedatangan belum/proses', '#f59e0b', 'st-notarr')
    + '</div>'
    + '<div class="card"><h3>⚠ Order Perlu Tindak Lanjut (Tanpa PO / Approval Belum Lengkap)</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Divisi</th><th>PR</th><th>PO</th><th>Approval 1</th><th>Approval 2</th><th>Alur</th><th>Status Kedatangan</th><th>Umur</th></tr></thead><tbody>'+pendingRows+'</tbody></table></div></div>'
    + '</section>';
}

function renderAging(){
  /* Order dengan Status Kedatangan "Sudah" tidak masuk perhitungan aging/warning (barang telah tiba) */
  var pool = state.showArrivedAging
    ? ROWS
    : ROWS.filter(function(r){ return r.statusKey!=='sudah'; });
  var excluded = ROWS.length - pool.length;
  var sorted = pool.slice().sort(function(a,b){ return (b.age||0)-(a.age||0); });
  var crit = pool.filter(function(r){ return agingClass(r)==='crit'; }).length;
  var warn = pool.filter(function(r){ return agingClass(r)==='warn'; }).length;
  var ok = pool.filter(function(r){ return agingClass(r)==='ok'; }).length;

  var rows = sorted.map(function(r){
    var ac = agingClass(r);
    var cls = ac==='crit' ? 'row-crit' : (ac==='warn' ? 'row-warn' : '');
    var blockers = [];
    if(!r.hasPO) blockers.push('<span class="badge crit">tanpa PO</span>');
    if(!r.appr1) blockers.push('<span class="badge appr-no">appr.1 belum</span>');
    if(!r.appr2) blockers.push('<span class="badge appr-no">appr.2 belum</span>');
    var k = rowKey(r);
    return '<tr class="'+cls+'">'
      + '<td class="mono">'+(r.tgl?esc(r.tgl):'—')+'</td>'
      + '<td><span class="badge divi">'+esc(r.divisi)+'</span></td>'
      + '<td class="mono">'+(r.pr?esc(r.pr):'—')+'</td>'
      + '<td class="mono">'+(r.po?esc(r.po):'—')+'</td>'
      + '<td>'+esc((r.items[0]||'') )+(r.items.length>1 ? ' <span class="mini">+'+ (r.items.length-1) +' item</span>' : '')+'</td>'
      + '<td>'+agingBadge(r)+'</td>'
      + '<td>'+(blockers.length? blockers.join(' ') : '<span class="badge ok">lengkap</span>')+'</td>'
      + '<td><div style="display:flex;gap:6px">'
      + '<button class="btn-act edit" data-edit="'+esc(k)+'" title="Edit order">'+IC.edit+'</button>'
      + '<button class="btn-act del" data-del="'+esc(k)+'" title="Hapus order">'+IC.trash+'</button>'
      + '</div></td>'
      + '</tr>';
  }).join('');

  return '<section class="tab-page">'
    + '<div class="toolbar">'
    + '<div class="range-wrap"><label for="warnNum">Ambang warning:</label><input type="number" id="warnNum" class="num-in" min="1" max="365" step="1" value="'+state.warnTh+'" title="Ketik jumlah hari"><span class="mini">hari</span><label for="critNum">Ambang kritis:</label><input type="number" id="critNum" class="num-in" min="1" max="365" step="1" value="'+state.critTh+'" title="Ketik jumlah hari"><span class="mini">hari</span></div>'
    + '<label class="sync-pill wrap-on" style="cursor:pointer" title="Order yang barangnya sudah datang disembunyikan dari daftar aging"><input type="checkbox" id="showArrivedChk"'+(state.showArrivedAging?' checked':'')+' style="accent-color:#10b981"> Tampilkan yang sudah datang ('+nf(excluded)+')</label>'
    + '</div>'
    + '<div class="grid cols-3" style="margin-bottom:16px">'
    + kpi(IC.alert, nf(crit), 'Kritis', 'umur ≥ '+state.critTh+' hari — segera follow-up', '#ef4444', 'ag-crit')
    + kpi(IC.clock, nf(warn), 'Warning', 'umur ≥ '+state.warnTh+' hari', '#f59e0b', 'ag-warn')
    + kpi(IC.check, nf(ok), 'Aman', 'umur < '+state.warnTh+' hari', '#10b981', 'ag-ok')
    + kpi(IC.box, nf(excluded), 'Sudah Datang', 'tidak dihitung aging — barang telah tiba', '#0ea5e9', 'ag-arr')
    + '</div>'
    + '<div class="card"><h3>Daftar Order Berdasarkan Umur (terlama dulu)</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Divisi</th><th>PR</th><th>PO</th><th>Barang</th><th>Umur</th><th>Blocker</th><th>Aksi</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    + '<p class="hint">Baris diurutkan dari umur terlama. Order dengan Status Kedatangan <b>Sudah</b> tidak dihitung sebagai warning/kritis karena barangnya telah tiba ('+nf(excluded)+' order dikecualikan) — centang "Tampilkan yang sudah datang" untuk melihatnya. Order lama ditandai kuning (warning) / merah (kritis); kolom "Blocker" menunjukkan alasan belum selesai (tanpa PO / approval belum).</p></div>'
    + '</section>';
}

function renderTable(){
  var q = state.q.toLowerCase();
  var rows = ROWS.filter(function(r){
    if(state.divFilter!=='all' && r.divisi!==state.divFilter) return false;
    if(state.stFilter!=='all' && r.statusKey!==state.stFilter) return false;
    if(q){
      var hay = (r.divisi+' '+r.pr+' '+r.po+' '+r.jenis+' '+r.ket+' '+r.keperluan+' '+r.status+' '+(r.arrivalRaw||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  state.exportRows = rows;

  var srt = state;
  rows.sort(function(a,b){
    var ka, kb;
    switch(srt.sortKey){
      case 'tgl': ka = a.date? a.date.getTime():0; kb = b.date? b.date.getTime():0; break;
      case 'divisi': ka=a.divisi; kb=b.divisi; return ka.localeCompare(kb)*srt.sortDir;
      case 'pr': ka=parseInt(a.pr,10)||0; kb=parseInt(b.pr,10)||0; break;
      case 'po': ka=parseInt(a.po,10)||0; kb=parseInt(b.po,10)||0; break;
      case 'status': ka=a.status; kb=b.status; return ka.localeCompare(kb)*srt.sortDir;
      case 'age': ka=a.age==null?-1:a.age; kb=b.age==null?-1:b.age; break;
      default: ka=0; kb=0;
    }
    return (ka>kb?1:ka<kb?-1:0)*srt.sortDir;
  });

  var divOpts = ['<option value="all">Semua Divisi</option>'].concat(divisiList().map(function(d){ return '<option value="'+esc(d)+'"'+(state.divFilter===d?' selected':'')+'>'+esc(d)+'</option>'; })).join('');

  /* filter Status Kedatangan — opsi diambil dari nilai yang ada di data */
  var stOpts = '<option value="all"'+(state.stFilter==='all'?' selected':'')+'>Semua Status Kedatangan</option>';
  ['sudah','proses','kosong','sebagian','batal','lain'].forEach(function(kk){
    var labelMap = {'sudah':'Sudah datang','proses':'Belum / Proses','kosong':'Belum diisi','sebagian':'Sebagian','batal':'Batal','lain':'Lainnya'};
    if(!ROWS.some(function(r){ return r.statusKey===kk; })) return;
    var lbl = labelMap[kk];
    stOpts += '<option value="'+kk+'"'+(state.stFilter===kk?' selected':'')+'>'+lbl+'</option>';
  });

  var arrow = function(k){ return state.sortKey===k ? (state.sortDir===1?' ▲':' ▼') : ''; };

  var trs = rows.map(function(r){
    var ac = agingClass(r);
    var cls = ac==='crit' ? 'row-crit' : (ac==='warn' ? 'row-warn' : '');
    var items = '<ul class="cellitems">'+r.items.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('')+'</ul>';
    var k = rowKey(r);
    var actBtns = '<td><div style="display:flex;gap:6px">'
      + '<button class="btn-act edit" data-edit="'+esc(k)+'" title="Edit order">'+IC.edit+'</button>'
      + '<button class="btn-act del" data-del="'+esc(k)+'" title="Hapus order">'+IC.trash+'</button>'
      + '</div></td>';
    return '<tr class="'+cls+'">'
      + '<td class="mono">'+(r.tgl?esc(r.tgl):'—')+'</td>'
      + '<td><span class="badge divi">'+esc(r.divisi)+'</span></td>'
      + '<td class="mono">'+(r.pr?esc(r.pr):'—')+'</td>'
      + '<td class="mono">'+(r.po?esc(r.po):'—')+'</td>'
      + '<td>'+items+'</td>'
      + '<td>'+apprBadge(r.a1, r.appr1)+'</td>'
      + '<td>'+apprBadge(r.a2, r.appr2)+'</td>'
      + '<td>'+statusBadge(r)+'</td>'
      + '<td>'+agingBadge(r)+'</td>'
      + '<td>'+esc(r.keperluan)+'</td>'
      + '<td>'+(r.ket ? esc(r.ket) : '<span class="mini">—</span>')+'</td>'
      + actBtns
      + '</tr>';
  }).join('');

  return '<section class="tab-page">'
    + '<div class="toolbar">'
    + '<div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="qInput" placeholder="Cari: PR, PO, barang, divisi…" value="'+esc(state.q)+'"></div>'
    + '<select class="select" id="divSel">'+divOpts+'</select>'
    + '<select class="select" id="stSel">'+stOpts+'</select>'
    + '<span class="count-pill">'+nf(rows.length)+' / '+nf(ROWS.length)+' baris</span>'
    + '</div>'
    + '<div class="tablewrap"><table>'
    + '<thead><tr>'
    + '<th class="sortable" data-k="tgl">Tanggal'+arrow('tgl')+'</th>'
    + '<th class="sortable" data-k="divisi">Divisi'+arrow('divisi')+'</th>'
    + '<th class="sortable" data-k="pr">Nomor PR'+arrow('pr')+'</th>'
    + '<th class="sortable" data-k="po">Nomor PO'+arrow('po')+'</th>'
    + '<th>Jenis Order (Barang)</th>'
    + '<th>Approval 1</th><th>Approval 2</th>'
    + '<th class="sortable" data-k="status">Status Kedatangan'+arrow('status')+'</th>'
    + '<th class="sortable" data-k="age">Umur'+arrow('age')+'</th>'
    + '<th>Keperluan</th>'
    + '<th>Keterangan</th>'
    + '<th>Aksi</th>'
    + '</tr></thead><tbody>'+(trs||'<tr><td colspan="12"><div class="empty">Tidak ada data cocok</div></td></tr>')+'</tbody></table></div>'
    + '</section>';
}
