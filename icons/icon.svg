<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ikon PWA Monitor Order PR & PO — full-bleed, tanpa border putih -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.42" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- latar penuh 100% (tidak ada sudut transparan/putih) -->
  <rect width="100" height="100" fill="url(#g)"/>
  <rect width="100" height="100" fill="url(#bloom)"/>

  <!-- bayangan clipboard -->
  <rect x="23.2" y="22.3" width="56" height="68" rx="6.2" fill="#0f172a" opacity="0.30" filter="url(#sh)"/>

  <!-- clipboard -->
  <rect x="22" y="19.5" width="56" height="68" rx="6.2" fill="#ffffff"/>
  <rect x="22.5" y="20" width="55" height="67" rx="5.9" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>

  <!-- penjepit atas -->
  <rect x="38.5" y="11.8" width="23" height="13.7" rx="3.8" fill="#ffffff"/>
  <circle cx="50" cy="17.8" r="3.2" fill="#4338ca"/>
  <circle cx="50" cy="17.8" r="1.5" fill="#ffffff"/>

  <!-- centang -->
  <path d="M35.5 48.5 L45.5 59.5 L65.5 37.5" fill="none" stroke="#4338ca" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- garis order -->
  <rect x="35.5" y="66.5" width="29" height="4" rx="1.2" fill="#0ea5e9"/>
  <rect x="35.5" y="74.5" width="19" height="4" rx="1.2" fill="#0ea5e9"/>
</svg>
