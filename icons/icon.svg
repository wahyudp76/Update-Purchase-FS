<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ikon PWA Monitor Order PR & PO — full-bleed: centang + garis order, tanpa box putih -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.42" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#g)"/>
  <rect width="100" height="100" fill="url(#bloom)"/>

  <!-- bayangan lembut centang -->
  <path d="M32.4 48.4 45.4 61.4 70.4 32.4" fill="none" stroke="#0f172a" opacity="0.28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh)"/>

  <!-- centang besar putih -->
  <path d="M31 47 44 60 69 31" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- garis daftar order -->
  <rect x="31" y="71.5" width="38" height="6.5" rx="3.2" fill="#ffffff" opacity="0.94"/>
  <rect x="31" y="83.5" width="22" height="6.5" rx="3.2" fill="#ffffff" opacity="0.80"/>
</svg>
