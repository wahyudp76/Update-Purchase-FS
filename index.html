/* ============ DRILL-DOWN: klik kategori box → daftar order ============ */
function drillSpec(key){
  var byAge = function(f){ return ROWS.filter(f).slice().sort(function(a,b){ return (b.age||0)-(a.age||0); }); };
  var k = String(key || '');
  if(k==='ov-all')      return {t:'Semua Order (PR)',            c:'#4f46e5', rows:byAge(function(r){ return true; })};
  if(k==='ov-po')       return {t:'PO Dibuat',                   c:'#0ea5e9', rows:byAge(function(r){ return r.hasPO; })};
  if(k==='ov-nopo')     return {t:'Belum Ada PO',     s:'nomor PO belum dibuat',            c:'#ef4444', rows:byAge(function(r){ return !r.hasPO; })};
  if(k==='ov-waitappr') return {t:'Approval Belum Lengkap', s:'approval 1 / 2 belum lengkap', c:'#f59e0b', rows:byAge(function(r){ return !r.appr1 || !r.appr2; })};
  if(k==='ov-arrived')  return {t:'Sudah Datang',                c:'#10b981', rows:byAge(function(r){ return r.statusKey==='sudah'; })};
  if(k==='ov-warn')     return {t:'Warning Aging',               c:'#ef4444', rows:byAge(function(r){ var c2=agingClass(r); return c2==='warn' || c2==='crit'; })};
  if(k==='ag-crit')     return {t:'Aging Kritis',  s:'umur ≥ '+state.critTh+' hari · belum datang', c:'#ef4444', rows:byAge(function(r){ return agingClass(r)==='crit'; })};
  if(k==='ag-warn')     return {t:'Aging Warning', s:'umur ≥ '+state.warnTh+' hari · belum datang', c:'#f59e0b', rows:byAge(function(r){ return agingClass(r)==='warn'; })};
  if(k==='ag-ok')       return {t:'Aman',          s:'umur < '+state.warnTh+' hari · belum datang', c:'#10b981', rows:byAge(function(r){ return agingClass(r)==='ok'; })};
  if(k==='ag-arr')      return {t:'Sudah Datang',  s:'tidak dihitung aging — barang telah tiba',    c:'#0ea5e9', rows:byAge(function(r){ return r.statusKey==='sudah'; })};
  if(k==='st-done')     return {t:'Approval Lengkap',  c:'#10b981', rows:byAge(function(r){ return r.flowKey==='done'; })};
  if(k==='st-wait')     return {t:'Menunggu Approval', c:'#f59e0b', rows:byAge(function(r){ return r.hasPO && r.flowKey==='wait'; })};
  if(k==='st-nopo')     return {t:'Belum Ada PO',      c:'#ef4444', rows:byAge(function(r){ return !r.hasPO; })};
  if(k==='st-arr')      return {t:'Sudah Datang',      c:'#10b981', rows:byAge(function(r){ return r.statusKey==='sudah'; })};
  if(k==='st-notarr')   return {t:'Belum Datang',      c:'#f59e0b', rows:byAge(function(r){ return r.statusKey!=='sudah'; })};
  if(k==='ap-a1')       return {t:'Approval 1 OK',     c:'#8b5cf6', rows:byAge(function(r){ return r.appr1; })};
  if(k==='ap-a2')       return {t:'Approval 2 OK',     c:'#10b981', rows:byAge(function(r){ return r.appr2; })};
  if(k.indexOf('div:')===0){
    var dv = k.slice(4);
    return {t:'Divisi: '+dv, c:divisiColor(dv), rows:byAge(function(r){ return r.divisi===dv; })};
  }
  if(k.indexOf('stv:')===0){
    var kk = k.slice(4);
    var lbl = kk==='kosong' ? '(belum diisi)' : ((ROWS.filter(function(r){ return r.statusKey===kk; })[0] || {}).status || kk);
    return {t:'Status Kedatangan: '+lbl, c:'#4f46e5', rows:byAge(function(r){ return r.statusKey===kk; })};
  }
  if(k.indexOf('kep:')===0){
    var kp = k.slice(4);
    return {t:'Keperluan Order: '+kp, c:'#8b5cf6', rows:byAge(function(r){ return r.keperluan===kp; })};
  }
  if(k.indexOf('item:')===0){
    var nm = k.slice(5).toLowerCase();
    return {t:'Item: '+nm, c:'#4f46e5', rows:byAge(function(r){ return r.items.some(function(it){ return (splitQty(it).name || '').toLowerCase()===nm; }); })};
  }
  return null;
}

function openDrill(key){
  var spec = drillSpec(key);
  if(!spec){ toast('Kategori tidak dikenal'); return; }
  var rows = spec.rows;
  var trs = rows.length ? rows.map(function(r){
    var ac = agingClass(r);
    var cls = ac==='crit' ? 'row-crit' : (ac==='warn' ? 'row-warn' : '');
    var k = rowKey(r);
    return '<tr class="'+cls+'">'
      + '<td class="mono">'+(r.tgl?esc(r.tgl):'—')+'</td>'
      + '<td><span class="badge divi">'+esc(r.divisi)+'</span></td>'
      + '<td class="mono">'+(r.pr?esc(r.pr):'—')+'</td>'
      + '<td class="mono">'+(r.po?esc(r.po):'—')+'</td>'
      + '<td>'+esc(r.items[0]||'')+(r.items.length>1 ? ' <span class="mini">+'+(r.items.length-1)+' item</span>' : '')+'</td>'
      + '<td>'+statusBadge(r)+'</td>'
      + '<td>'+agingBadge(r)+'</td>'
      + '<td><div style="display:flex;gap:6px">'
      + '<button class="btn-act edit" data-edit="'+esc(k)+'" title="Edit order">'+IC.edit+'</button>'
      + '<button class="btn-act del" data-del="'+esc(k)+'" title="Hapus order">'+IC.trash+'</button>'
      + '</div></td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="8"><div class="empty">Tidak ada order dalam kategori ini</div></td></tr>';

  var dot = document.getElementById('drillDot');
  if(dot) dot.style.background = spec.c;
  var tEl = document.getElementById('drillTitle');
  if(tEl) tEl.innerHTML = esc(spec.t)+' <span class="mini">· '+nf(rows.length)+' order</span>'+(spec.s ? ' <span class="mini">('+esc(spec.s)+')</span>' : '');
  var body = document.getElementById('drillBody');
  if(body){
    body.innerHTML = '<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Divisi</th><th>PR</th><th>PO</th><th>Barang</th><th>Status Kedatangan</th><th>Umur</th><th>Aksi</th></tr></thead><tbody>'+trs+'</tbody></table></div>';
    body.querySelectorAll('[data-edit]').forEach(function(el){
      el.addEventListener('click', function(){ closeDrill(); openEditModal(el.getAttribute('data-edit')); });
    });
    body.querySelectorAll('[data-del]').forEach(function(el){
      el.addEventListener('click', function(){ closeDrill(); confirmDelete(el.getAttribute('data-del')); });
    });
  }
  var back = document.getElementById('drillBack');
  if(back) back.style.display = 'flex';
}

function closeDrill(){
  var back = document.getElementById('drillBack');
  if(back) back.style.display = 'none';
}

/* ============ EVENTS ============ */
function bindSection(){
  var nav = document.getElementById('tabsNav');
  Array.prototype.forEach.call(nav.querySelectorAll('.tab'), function(el){
    el.addEventListener('click', function(){
      state.tab = el.getAttribute('data-tab');
      render();
    });
  });

  document.querySelectorAll('.divi-card').forEach(function(el){
    el.addEventListener('click', function(){
      state.divFilter = el.getAttribute('data-d');
      state.tab = 'tabel';
      render();
      toast('Filter divisi: '+state.divFilter);
    });
  });

  var q = document.getElementById('qInput');
  if(q){
    var qTimer = null;
    q.addEventListener('input', function(){
      state.q = q.value;
      clearTimeout(qTimer);
      qTimer = setTimeout(renderTableOnly, 160); /* debounce: render setelah user berhenti mengetik */
    });
  }
  var ds = document.getElementById('divSel');
  if(ds){ ds.addEventListener('change', function(){ state.divFilter=ds.value; renderTableOnly(); }); }
  var ss = document.getElementById('stSel');
  if(ss){ ss.addEventListener('change', function(){ state.stFilter=ss.value; renderTableOnly(); }); }

  var ths = document.querySelectorAll('th.sortable');
  ths.forEach(function(th){
    th.addEventListener('click', function(){
      var k = th.getAttribute('data-k');
      if(state.sortKey===k) state.sortDir = -state.sortDir;
      else { state.sortKey=k; state.sortDir = k==='age'||k==='tgl' ? -1 : 1; }
      renderTableOnly();
    });
  });

  /* ambang aging: ketik angka → langsung dipakai & tersimpan (tidak reset saat refresh) */
  function commitThreshold(){
    var wn = document.getElementById('warnNum');
    var cn = document.getElementById('critNum');
    var wv = wn ? parseInt(wn.value, 10) : NaN;
    var cv = cn ? parseInt(cn.value, 10) : NaN;
    if(!isFinite(wv) || wv < 1) wv = state.warnTh;   /* kosong/invalid → pakai nilai lama */
    if(!isFinite(cv) || cv < 1) cv = state.critTh;
    wv = Math.min(365, wv); cv = Math.min(365, cv);
    state.warnTh = wv;
    if(cv < wv) cv = wv;                              /* kritis tidak boleh < warning */
    state.critTh = cv;
    persistTh();
    render();
  }
  var wNum = document.getElementById('warnNum');
  if(wNum){
    wNum.addEventListener('change', commitThreshold);
    wNum.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); wNum.blur(); } });
  }
  var cNum = document.getElementById('critNum');
  if(cNum){
    cNum.addEventListener('change', commitThreshold);
    cNum.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); cNum.blur(); } });
  }
  var sa = document.getElementById('showArrivedChk');
  if(sa){
    sa.addEventListener('change', function(){
      state.showArrivedAging = sa.checked;
      render();
    });
  }

  /* aksi edit/hapus per baris */
  document.querySelectorAll('[data-edit]').forEach(function(el){
    el.addEventListener('click', function(){ openEditModal(el.getAttribute('data-edit')); });
  });
  document.querySelectorAll('[data-del]').forEach(function(el){
    el.addEventListener('click', function(){ confirmDelete(el.getAttribute('data-del')); });
  });
}

function renderTableOnly(){
  var main = document.getElementById('main');
  if(state.tab==='tabel'){
    var q = document.getElementById('qInput') ? document.getElementById('qInput').value : state.q;
    state.q = q;
    main.innerHTML = renderTable();
    bindSection();
    /* fokus kembali ke input */
    var qi = document.getElementById('qInput');
    if(qi){ qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  }
}

/* ============ EXPORT ============ */
function exportCSV(){
  var rows = state.exportRows && state.exportRows.length ? state.exportRows : ROWS;
  var head = ['Tanggal','Divisi','Nomor PR','Nomor PO','Jenis Order','Approval 1','Approval 2','Status Kedatangan','Umur (hari)','Keterangan','Keperluan Order'];
  var lines = [head.join(',')];
  rows.forEach(function(r){
    var cells = [r.tgl, r.divisi, r.pr, r.po, r.jenis.replace(/\n+/g,'; '), r.a1, r.a2, r.status, r.age==null?'':r.age, r.ket, r.keperluan];
    lines.push(cells.map(function(c){
      c = String(c==null?'':c);
      if(/^[=+@]/.test(c)) c = "'" + c; /* cegah formula injection saat dibuka di Excel */
      return '"'+c.replace(/"/g,'""')+'"';
    }).join(','));
  });
  var blob = new Blob(["\uFEFF"+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'order-pr-po-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('CSV diekspor ('+rows.length+' baris)');
}

/* ============ TAMBAH / EDIT / HAPUS ============ */
var MODAL_ROWKEY = null;

function findRowByKey(k){
  var found = null;
  ROWS.forEach(function(r){ if(rowKey(r) === k) found = r; });
  return found;
}

function toggleModal(show, info){
  var back = document.getElementById('modalBack');
  back.style.display = show ? 'flex' : 'none';
  if(show){
    var note = document.getElementById('modalNote');
    if(info && info.note){
      note.innerHTML = info.note;
      note.style.display = 'block';
    } else {
      note.style.display = 'none';
    }
  }
}

function openAddModal(){
  MODAL_ROWKEY = null;
  var saveBtn = document.getElementById('modalSave');
  saveBtn.dataset.mode = 'save';
  saveBtn.disabled = false;
  saveBtn.textContent = 'Simpan';
  saveBtn.className = 'btn-sm prim';
  document.getElementById('modalBody').classList.remove('hide-fields');
  document.getElementById('modalTitle').textContent = 'Tambah Order';
  var today = new Date();
  var dd = String(today.getDate()).padStart(2,'0');
  var mm = String(today.getMonth()+1).padStart(2,'0');
  var yyyy = today.getFullYear();
  var vals = { fDivisi:'', fTgl: dd+'/'+mm+'/'+yyyy, fPr:'', fPo:'', fJenis:'', fA1:'Belum', fA2:'Belum', fKeperluan:'', fArrival:'Belum', fKet:'' };
  Object.keys(vals).forEach(function(id){ document.getElementById(id).value = vals[id]; });
  toggleModal(true, { note: 'Order baru akan ditulis <b>langsung ke spreadsheet</b> (tab "' + SHEET_NAME + '") melalui Google Apps Script.' });
}

function openEditModal(k){
  var r = findRowByKey(k);
  if(!r){ toast('Baris tidak ditemukan'); return; }
  MODAL_ROWKEY = k;
  var saveBtn = document.getElementById('modalSave');
  saveBtn.dataset.mode = 'save';
  saveBtn.disabled = false;
  saveBtn.textContent = 'Simpan';
  saveBtn.className = 'btn-sm prim';
  document.getElementById('modalBody').classList.remove('hide-fields');
  document.getElementById('modalTitle').textContent = 'Edit Order';
  setSelect('fDivisi', r.divisi === 'Tanpa Divisi' ? '' : r.divisi);
  document.getElementById('fTgl').value = r.tgl || '';
  document.getElementById('fPr').value = r.pr || '';
  document.getElementById('fPo').value = r.po || '';
  document.getElementById('fJenis').value = (r.items || []).map(function(it){ return '- ' + it; }).join('\n');
  setSelect('fA1', r.a1);
  setSelect('fA2', r.a2);
  setSelect('fArrival', r.arrivalRaw || r.status);
  setSelect('fKeperluan', r.keperluan === '—' ? '' : r.keperluan);
  document.getElementById('fKet').value = r.ket || '';
  toggleModal(true, { note: 'Perubahan ditulis <b>langsung ke spreadsheet</b>. Baris: PR ' + (r.pr||'-') + ' / PO ' + (r.po||'-') + '.' });
}

/* set nilai dropdown; bila nilai data belum ada di opsi, tambahkan agar tidak hilang */
function setSelect(id, val){
  var el = document.getElementById(id);
  if(!el) return;
  var v = String(val || '').trim();
  if(!v){ el.value = (el.options[0] && el.options[0].value) || ''; return; }
  var found = false;
  for(var i=0;i<el.options.length;i++){ if(el.options[i].value === v){ found = true; break; } }
  if(!found){
    var o = document.createElement('option');
    o.value = v; o.textContent = v;
    el.appendChild(o);
  }
  el.value = v;
}

function confirmDelete(k){
  var r = findRowByKey(k);
  if(!r){ toast('Baris tidak ditemukan'); return; }
  MODAL_ROWKEY = k;
  var back = document.getElementById('modalBack');
  var body = document.getElementById('modalBody');
  var saveBtn = document.getElementById('modalSave');
  body.classList.add('hide-fields');
  document.getElementById('modalTitle').textContent = 'Hapus Order';
  saveBtn.dataset.mode = 'delete';
  saveBtn.disabled = false;
  var note = document.getElementById('modalNote');
  note.innerHTML = 'Yakin hapus baris <b>PR ' + (r.pr||'-') + ' / PO ' + (r.po||'-') + '</b> (' + r.divisi + ')? Baris akan <b>dihapus permanen</b> dari spreadsheet.';
  note.style.display = 'block';
  saveBtn.textContent = 'Ya, Hapus';
  saveBtn.className = 'btn-sm danger';
  back.style.display = 'flex';
}

function resetModalForm(){
  var body = document.getElementById('modalBody');
  body.classList.remove('hide-fields');
  var saveBtn = document.getElementById('modalSave');
  saveBtn.textContent = 'Simpan';
  saveBtn.className = 'btn-sm prim';
  saveBtn.disabled = false;            /* penting: lepas state disabled dari aksi sebelumnya */
  saveBtn.dataset.mode = 'save';
  var note = document.getElementById('modalNote');
  note.style.display = 'none';
}

function closeModal(){
  document.getElementById('modalBack').style.display = 'none';
  MODAL_ROWKEY = null;
  resetModalForm();
}

function buildVals(forToken){
  var v = {};
  v['Divisi'] = document.getElementById('fDivisi').value.trim();
  v['Tanggal Input Reservasi'] = document.getElementById('fTgl').value.trim();
  v['Nomor PR'] = document.getElementById('fPr').value.trim();
  v['Nomor PO'] = document.getElementById('fPo').value.trim();
  v['Jenis Order'] = document.getElementById('fJenis').value.trim();
  v['Approval 1'] = document.getElementById('fA1').value.trim();
  v['Approval 2'] = document.getElementById('fA2').value.trim();
  v['Keperluan Order'] = document.getElementById('fKeperluan').value.trim();
  v['Status Kedatangan'] = document.getElementById('fArrival').value.trim();
  v['Keterangan'] = document.getElementById('fKet').value.trim();
  return v;
}

/* Pastikan data segar sebelum menulis: bila data >60 dtk, sync dulu supaya
   edit/hapus tidak mengenai baris yang salah (posisi baris di sheet bisa berubah). */
async function ensureFreshForWrite(){
  if(!LAST_SYNC || (Date.now() - LAST_SYNC.getTime()) > 60000){
    await refresh();
    if(SYNC_BUSY){
      /* sync lain sedang berjalan — tunggu sebentar hingga selesai (maks ±5 dtk) */
      for(var i=0;i<50 && SYNC_BUSY;i++){ await new Promise(function(res){ setTimeout(res,100); }); }
    }
  }
}

/* validasi field wajib — sama seperti Google Form asli */
function validateForm(){
  var miss = [];
  var tgl = document.getElementById('fTgl').value.trim();
  if(!tgl || !parseDMY(tgl)) miss.push(['fTgl','Tanggal Input Reservasi (dd/mm/yyyy)']);
  if(!document.getElementById('fDivisi').value.trim()) miss.push(['fDivisi','Divisi']);
  if(!document.getElementById('fKeperluan').value.trim()) miss.push(['fKeperluan','Keperluan Order']);
  if(!document.getElementById('fJenis').value.trim()) miss.push(['fJenis','Jenis Order (barang)']);
  if(!document.getElementById('fArrival').value.trim()) miss.push(['fArrival','Status Kedatangan']);
  if(miss.length){
    toast('Wajib diisi: ' + miss[0][1] + (miss.length>1 ? ' (+'+(miss.length-1)+' field lagi)' : ''));
    var el = document.getElementById(miss[0][0]);
    if(el){
      try{ el.focus(); }catch(e){}
      el.style.borderColor = '#ef4444';
      setTimeout(function(){ el.style.borderColor = ''; }, 1800);
    }
    return false;
  }
  return true;
}

async function handleSave(){
  var saveBtn = document.getElementById('modalSave');
  saveBtn.dataset.mode = saveBtn.dataset.mode || 'save';
  if(saveBtn.dataset.mode === 'delete'){
    saveBtn.disabled = true; saveBtn.textContent = 'Memeriksa data…';
    try{
      await ensureFreshForWrite();
      var r = findRowByKey(MODAL_ROWKEY);
      if(!r){
        toast('Baris sudah berubah/dihapus di spreadsheet — data dimuat ulang, silakan periksa lagi');
        saveBtn.disabled = false; saveBtn.textContent = 'Ya, Hapus';
        return;
      }
      saveBtn.textContent = 'Menghapus…';
      await updateGoogleSheet(rowKey(r), 'delete', null);
      toast('Order dihapus dari spreadsheet');
      closeModal();
      refresh();
    }catch(e){
      alert('Gagal menghapus: ' + (e && e.message || e));
      saveBtn.disabled = false; saveBtn.textContent = 'Ya, Hapus';
    }
    return;
  }

  var vals = buildVals();
  var isEdit = !!MODAL_ROWKEY;

  if(!validateForm()) return; /* field wajib belum lengkap — jangan kirim */

  saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan…';
  try{
    if(isEdit){
      await ensureFreshForWrite();
      if(!findRowByKey(MODAL_ROWKEY)){
        toast('Baris sudah berubah/dihapus di spreadsheet — data dimuat ulang, silakan periksa lagi');
        saveBtn.disabled = false; saveBtn.textContent = 'Simpan';
        return;
      }
      await updateGoogleSheet(MODAL_ROWKEY, 'edit', vals);
      toast('Order diperbarui di spreadsheet');
    } else {
      await updateGoogleSheet(null, 'add', vals);
      toast('Order ditambahkan ke spreadsheet');
    }
    closeModal();
    refresh();
  }catch(e){
    var msg = e && e.message ? e.message : e;
    toast('Gagal: ' + msg);
    alert('Gagal ' + (isEdit ? 'memperbarui' : 'menambah') + ': ' + msg);
    saveBtn.disabled = false; saveBtn.textContent = 'Simpan';
  }
}

/* penerjemah aksi -> Apps Script web app */
function updateGoogleSheet(rowId, mode, values){
  if(!scriptConfigured()){
    return Promise.reject(new Error(scriptHint()));
  }
  return callScript(mode, rowId != null ? String(rowId) : null, values || {});
}

/* ============ INIT ============ */
document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('exportBtn').addEventListener('click', exportCSV);
document.getElementById('syncBannerClose').addEventListener('click', hideSyncBanner);
document.getElementById('addBtn').addEventListener('click', openAddModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalBack').addEventListener('click', function(e){ if(e.target === this) closeModal(); });
document.getElementById('modalSave').addEventListener('click', handleSave);

/* --- PWA: tombol install & service worker --- */
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  var b = document.getElementById('installBtn');
  b.style.display = 'inline-flex';
  if(!b._pfsBound){ /* pasang listener sekali saja — event ini bisa fire berulang */
    b._pfsBound = true;
    b.addEventListener('click', function(){
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){ deferredPrompt = null; b.style.display = 'none'; });
    });
  }
});
window.addEventListener('appinstalled', function(){
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
  toast('Dashboard terpasang sebagai aplikasi');
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* SW opsional */ });
  });
}

document.getElementById('autoSync').addEventListener('change', function(e){
  clearInterval(AUTO_TIMER); AUTO_TIMER = null;
  if(e.target.checked){
    AUTO_TIMER = setInterval(function(){ if(!document.hidden) refresh(); }, 5*60*1000);
    toast('Auto-sync aktif (tiap 5 menit)');
  } else {
    toast('Auto-sync nonaktif');
  }
});

/* ===== drill-down global: klik box kategori di semua tab ===== */
document.addEventListener('click', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-drill]') : null;
  if(el){ e.preventDefault(); openDrill(el.getAttribute('data-drill')); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeDrill(); return; }
  if(e.key==='Enter'){
    var el = e.target && e.target.closest ? e.target.closest('[data-drill]') : null;
    if(el){ e.preventDefault(); openDrill(el.getAttribute('data-drill')); }
  }
});
(function(){
  var db = document.getElementById('drillBack');
  if(db) db.addEventListener('click', function(e){ if(e.target===db) closeDrill(); });
  var dc = document.getElementById('drillClose');
  if(dc) dc.addEventListener('click', closeDrill);
})();

/* init dengan snapshot dulu agar cepat tampil */
var _subEl = document.querySelector('.brand .sub');
if(_subEl) _subEl.textContent = 'Bahan & Spareparts · Sheet "' + SHEET_NAME + '" · Auto-sync';
setRows(loadFromSnapshot(), false, null);
/* jalankan auto-sync STARTUP (default ON karena checkbox checked) */
if(document.getElementById('autoSync').checked){
  AUTO_TIMER = setInterval(function(){ if(!document.hidden) refresh(); }, 5*60*1000);
}
/* tab kembali terlihat & data sudah stale >5 menit → sync segera (hemat baterai saat background) */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && document.getElementById('autoSync').checked && LAST_SYNC && (Date.now() - LAST_SYNC.getTime() > 5*60*1000)){
    refresh();
  }
});
refresh(); /* lalu coba live segera */

/* update service worker jika versi baru tersedia */
if('serviceWorker' in navigator && navigator.serviceWorker.controller){
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    /* versi baru aktif -> reload agar frame html terbaru */
    if(!location.hash) location.reload();
  });
}

})();
