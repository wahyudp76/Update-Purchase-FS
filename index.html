<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Order PR &amp; PO — Purchase Dashboard</title>
  <meta name="description" content="Dashboard monitor order bahan & spareparts: status PR/PO, approval, dan peringatan aging order. Auto-sync dari Google Sheets.">
  <meta name="theme-color" content="#4f46e5">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Order PR/PO">

  <!-- Favicon & icons -->
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="mask-icon" href="icons/icon.svg" color="#4f46e5">

  <!-- Windows tile -->
  <meta name="msapplication-TileColor" content="#4f46e5">
  <meta name="msapplication-TileImage" content="icons/mstile-150x150.png">
  <meta name="msapplication-config" content="browserconfig.xml">
  <style>
:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --line:#e7e9ee;
  --txt:#0f172a;
  --muted:#64748b;
  --accent:#4f46e5;
  --accent-2:#0ea5e9;
  --ok:#10b981;
  --warn:#f59e0b;
  --crit:#ef4444;
  --purple:#8b5cf6;
  --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.12);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--txt);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- Header ---------- */
header.top{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.header-inner{padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#4f46e5,#0ea5e9);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 14px -6px rgba(79,70,229,.55);
}
.brand h1{font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff}
.sync-pill .dot{width:8px;height:8px;border-radius:50%}
.sync-pill.wrap-on{white-space:nowrap}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.dot.off{background:var(--muted)}
.dot.load{background:var(--accent-2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--txt);
  border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn:hover{border-color:#c9cdd6;background:#fafbfc}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4338ca}
.btn svg{width:15px;height:15px}

/* ---------- Nav tabs ---------- */
nav.tabs{
  padding:0 22px;display:flex;gap:6px;overflow-x:auto;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);
  scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex;align-items:center;gap:8px;padding:12px 15px;
  font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;
  border-bottom:2.5px solid transparent;white-space:nowrap;transition:.15s;
}
.tab svg{width:16px;height:16px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- Layout ---------- */
main{padding:22px;max-width:1280px;margin:0 auto}
section.tab-page{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .spacer{flex:1}
.search{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:8px 12px;min-width:240px;
}
.search input{border:none;outline:none;font-size:13px;width:100%;background:none;color:var(--txt)}
select.select{
  border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;
  font-size:12.5px;font-weight:600;color:var(--txt);outline:none;
}

/* ---------- Cards & grid ---------- */
.grid{display:grid;gap:16px}
.cols-5{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:15px;height:15px}
.kpi{position:relative;overflow:hidden}
.kpi .ic{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:#fff;margin-bottom:12px;
}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:6px}
.spark{position:absolute;right:-14px;top:-14px;opacity:.5;width:96px;height:96px}

/* ---------- Bars / donut ---------- */
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--txt)}
.hbar-label .hbar-val{font-weight:700;color:var(--muted)}
.hbar-track{height:8px;background:#eef0f4;border-radius:999px;overflow:hidden}
.hbar-fill{height:100%;border-radius:999px;transition:width .5s ease}
.flex-split{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:9px;min-width:150px}
.legend .row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend .sw{width:11px;height:11px;border-radius:3.5px;flex-shrink:0}
.legend .num{margin-left:auto;font-weight:700;color:var(--muted)}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px}
thead th{
  text-align:left;padding:11px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--accent)}
tbody td{padding:11px 13px;border-bottom:1px solid #f0f1f5;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8f9fc}
td.mono{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.cellitems{margin:0;padding-left:15px;display:flex;flex-direction:column;gap:2px}
.cellitems li{font-size:12.3px;line-height:1.4}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:#ecfdf5;color:#047857}
.badge.warn{background:#fffbeb;color:#b45309}
.badge.crit{background:#fef2f2;color:#b91c1c}
.badge.na{background:#f1f5f9;color:#64748b}
.badge.appr{background:#eef2ff;color:#4338ca}
.badge.appr-ok{background:#ecfdf5;color:#047857}
.badge.appr-no{background:#fef2f2;color:#b91c1c}
.badge.divi{background:#eef2ff;color:#4338ca}

/* ---------- Age accent ---------- */
.row-warn{background:#fffdf5!important}
.row-crit{background:#fef7f7!important}
tr.row-warn:hover{background:#fff8e6!important}
tr.row-crit:hover{background:#ffeded!important}

/* ---------- Status stepper ---------- */
.stepper{display:flex;flex-wrap:wrap;gap:10px}
.step{flex:1;min-width:150px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.step .num{font-size:22px;font-weight:800}
.step .cap{font-size:12px;color:var(--muted);margin-top:2px}
.step .bar{height:5px;border-radius:99px;background:#e8ebf0;margin-top:10px;overflow:hidden}
.step .bar .fill{height:100%;border-radius:99px}
.step.done{background:#f0fdf6;border-color:#bbf1d4}

/* ---------- Divisi cards ---------- */
.divi-card{cursor:pointer;transition:.15s;position:relative}
.divi-card:hover{transform:translateY(-3px);border-color:#c7cbd6;box-shadow:0 14px 30px -16px rgba(15,23,42,.25)}
.divi-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.divi-ava{width:40px;height:40px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.divi-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.divi-meta .m{background:#f8fafc;border-radius:10px;padding:9px 11px}
.divi-meta .m .t{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.divi-meta .m .v{font-size:16px;font-weight:800;margin-top:2px}

/* ---------- Empty / misc ---------- */
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.range-wrap{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;flex-wrap:wrap}
.range-wrap label{font-size:12px;font-weight:700;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:180px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.mini{font-size:12px;color:var(--muted)}
.count-pill{font-size:12px;color:var(--muted);font-weight:600;padding:7px 12px;background:#fff;border:1px solid var(--line);border-radius:999px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{
  display:flex;align-items:center;gap:10px;margin:0 22px 12px;padding:11px 14px;
  border-radius:12px;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;
  font-size:13px;font-weight:600;
}
.banner .b-msg{flex:1}
.banner a{color:#b91c1c;text-decoration:underline}
.banner button{
  border:none;background:none;color:#b91c1c;font-size:17px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px;
}
.banner button:hover{background:#fee2e2}
@media(max-width:640px){.banner{margin:0 14px 10px}}

/* ---------- Action buttons (edit/delete) ---------- */
.btn-act{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.13s}
.btn-act:hover{transform:translateY(-1px)}
.btn-act svg{width:14px;height:14px}
.btn-act.edit:hover{color:var(--accent);border-color:var(--accent);background:#eef2ff}
.btn-act.del:hover{color:var(--crit);border-color:var(--crit);background:#fef2f2}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:70;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s ease}
.modal{background:#fff;border-radius:18px;box-shadow:0 24px 60px -20px rgba(15,23,42,.4);width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:15.5px;font-weight:800;letter-spacing:-.01em;flex:1}
.modal-close{border:none;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.modal-close:hover{background:#f1f5f9;color:var(--txt)}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.f-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.f-input,.f-textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;font-family:inherit;color:var(--txt);background:#fff;outline:none;transition:.13s}
.f-input:focus,.f-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.f-textarea{resize:vertical;min-height:96px;line-height:1.5}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-note{font-size:11.5px;color:var(--muted);line-height:1.5;background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:9px 11px}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:9px;font-weight:700;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-sm.gh{background:#fff;border-color:var(--line);color:var(--txt)}
.btn-sm.gh:hover{background:#f8fafc}
.btn-sm.prim{background:var(--accent);color:#fff}
.btn-sm.prim:hover{background:#4338ca}
.btn-sm.danger{background:var(--crit);color:#fff}
.btn-sm.danger:hover{background:#dc2626}
.btn-sm:disabled{opacity:.55;cursor:not-allowed}
.modal-body.hide-fields > *:not(#modalNote):not(#fTokenWrap){display:none}


@media(max-width:640px){
  .header-inner{padding:12px 14px}
  main{padding:14px}
  nav.tabs{padding:0 8px}
  .search{min-width:100%}
}
</style>
</head>
<body>

<header class="top">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5V3h6v1.5"/><path d="M8 4h8a1.5 1.5 0 0 1 1.5 1.5V20a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 20V5.5A1.5 1.5 0 0 1 8 4z"/><path d="M9.2 12.2l1.9 1.9 3.7-4"/></svg>
      </div>
      <div>
        <h1>Monitor Order PR &amp; PO</h1>
        <div class="sub">Bahan &amp; Spareparts · Sheet "Response" · Auto-sync</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="sync-pill" id="syncPill"><span class="dot load" id="syncDot"></span><span id="syncText">Memuat…</span></span>
      <label class="sync-pill wrap-on" style="cursor:pointer" title="Auto sync tiap 5 menit">
        <input type="checkbox" id="autoSync" checked style="accent-color:var(--accent)"> Auto-sync 5 menit
      </label>
      <button class="btn" id="refreshBtn" title="Ambil data terbaru dari spreadsheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Refresh
      </button>
      <button class="btn" id="installBtn" style="display:none" title="Pasang dashboard ini sebagai aplikasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        Install App
      </button>
      <button class="btn primary" id="addBtn" title="Tambah order baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Tambah
      </button>
      <button class="btn primary" id="exportBtn" title="Export data terfilter ke CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        Export CSV
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabsNav"></nav>
</header>

  <div class="banner" id="syncBanner" style="display:none">
    <span>⚠</span>
    <span class="b-msg" id="syncBannerMsg"></span>
    <button id="syncBannerClose" title="Tutup">×</button>
  </div>
  <main id="main"></main>
  <div class="toast" id="toast"></div>
  <div class="modal-back" id="modalBack" style="display:none">
    <div class="modal" id="modalBox">
      <div class="modal-head">
        <h2 id="modalTitle">Tambah Order</h2>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body" id="modalBody">
        <div class="f-note" id="modalNote" style="display:none"></div>
        <div class="f-note" id="fTokenWrap" style="display:none">
          <label class="f-label">Token akses (opsional)</label>
          <input class="f-input" id="fToken" placeholder="Tempel token Google dengan scope spreadsheet di sini bila tidak pakai OAuth">
          <div style="margin-top:6px;font-weight:400">Gunakan token sementara dari OAuth Playground / Apps Script bila Client ID belum diset.</div>
        </div>
        <div class="f-row">
          <div><label class="f-label">Divisi</label><input class="f-input" id="fDivisi" placeholder="cth: OP2"></div>
          <div><label class="f-label">Tanggal (dd/mm/yyyy)</label><input class="f-input" id="fTgl" placeholder="23/09/2026"></div>
        </div>
        <div class="f-row">
          <div><label class="f-label">Nomor PR</label><input class="f-input" id="fPr" placeholder="cth: 11290820"></div>
          <div><label class="f-label">Nomor PO</label><input class="f-input" id="fPo" placeholder="opsional"></div>
        </div>
        <div><label class="f-label">Jenis Order (barang) — satu baris per item</label><textarea class="f-textarea" id="fJenis" placeholder="- Ember plastik besar 15 pcs&#10;- Golok tebang biasa 15 pcs"></textarea></div>
        <div class="f-row">
          <div><label class="f-label">Approval 1</label><input class="f-input" id="fA1" placeholder="OK / Belum"></div>
          <div><label class="f-label">Approval 2</label><input class="f-input" id="fA2" placeholder="OK / Belum"></div>
        </div>
        <div><label class="f-label">Keperluan Order</label><input class="f-input" id="fKeperluan" placeholder="cth: Kantor"></div>
        <div><label class="f-label">Keterangan</label><input class="f-input" id="fKet" placeholder="opsional"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-sm gh" id="modalCancel">Batal</button>
        <button class="btn-sm prim" id="modalSave">Simpan</button>
      </div>
    </div>
  </div>

<script>
(function(){
'use strict';
/* ============ CONFIG ============ */
/* Bisa di-override via URL: ?sheetId=ID_FILE&sheet=NamaSheet (untuk tes cepat) */
var CFG = (function(){
  try {
    var p = new URLSearchParams(location.search);
    return {
      id: (p.get('sheetId') || p.get('sid') || '1F9BpVC2wrV2VIc5cJ5M5EmwlptXnnf6eafo0nMY7KFc'),
      sheet: (p.get('sheet') || 'Response'),
      gid: p.get('gid')
    };
  } catch(e) {
    return { id:'1F9BpVC2wrV2VIc5cJ5M5EmwlptXnnf6eafo0nMY7KFc', sheet:'Response', gid:null };
  }
})();
var SHEET_ID = CFG.id;
var SHEET_NAME = CFG.sheet;
var GVURL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json'

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function parseDMY(s){

function daysAgo(d){

/* ============ NORMALIZE ============ */
function normalize(raw){
  /* lookup case-insensitive: kunci kolom dari gviz memakai huruf kapital (mis. "Nomor PR") */
  var map = {};
  Object.keys(raw || {}).forEach(function(k){ map[String(k).toLowerCase()] = raw[k]; });
  var get = function(label){
    var v = map[String(label).toLowerCase()];
    return (v==null || v==='') ? '' : String(v).trim();
  };
  var ts = get('Timestamp');
  var tgl = get('Tanggal Input Reservasi');
  var divisi = get('Divisi') || 'Tanpa Divisi';
  var jenis = get('Jenis Order');
  var pr = get('Nomor PR');
  var po = get('Nomor PO');
  var a1 = get('Approval 1');
  var a2 = get('Approval 2');
  var ket = get('Keterangan');
  var keperluan = get('Keperluan Order') || '—';

  var items = parseItems(jenis);
  var dateObj = parseDMY(tgl) || parseDMY(ts);
  var age = dateObj ? daysAgo(dateObj) : null;
  var hasPO = po !== '';
  var appr1 = isOK(a1), appr2 = isOK(a2);
  var status = !hasPO ? 'Belum PO' : (!appr1 || !appr2) ? 'Menunggu Approval' : 'Selesai';
  var progress = [hasPO, appr1, appr2].filter(Boolean).length;

  return {
    raw: raw,
    ts: ts, tgl: tgl, divisi: divisi, jenis: jenis, pr: pr, po: po,
    a1: a1, a2: a2, ket: ket, keperluan: keperluan,
    items: items, hasPO: hasPO, appr1: appr1, appr2: appr2,
    status: status, progress: progress,
    date: dateObj, age: age, mkey: monthKey(dateObj)
  };
}

function loadLive(urlOverride){
  var url = urlOverride || GVURL;
  return fetch(url, {cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.text();
  }).then(function(text){
    var start = text.indexOf('{');
    var end = text.lastIndexOf('}');
    if(start<0 || end<0) throw new Error('Format tidak dikenali');
    var data = JSON.parse(text.slice(start, end+1));
    if(data.status !== 'ok') throw new Error('status '+data.status);
    var cols = data.table.cols.map(function(c){ return c.label; });
    return data.table.rows.map(function(r){
      var o = {};
      r.c.forEach(function(cell, i){
        var v = '';
        if(cell){
          if(cell.f != null) v = cell.f;
          else if(cell.v != null) v = cell.v;
          else v = '';
        }
        o[cols[i]] = v;
      });
      return o;
    });
  }).then(function(rawRows){
    return rawRows.map(normalize);
  });
}

function uniq(ps){
  var s = 0;
  var full = ps.join('|');
  for(var i=0;i<full.length;i++){ s = ((s<<5)-s) + full.charCodeAt(i); s |= 0; }
  return 'k' + (s>>>0).toString(36);
}

/* baris kosong berikutnya (0-based) untuk append — aman walau ada baris terhapus di tengah */
function firstEmptyRow(all){
  var max = 0;
  all.rows.forEach(function(r){
    var n = parseInt(r['No Row ID'], 10);
    if(!isNaN(n) && n > max) max = n;
  });
  if(max === 0) return 1; /* hanya header -> baris data pertama (0-based idx 1) */
  return max; /* No Row ID 1-based == 0-based index baris kosong berikutnya */
}

async function applyMutations(all, row, mode){
  var t = await ensureToken();
  var iconsheet = all.sheetId;
  var requests = [];

  if(mode === 'add'){
    var start = firstEmptyRow(all); /* 0-based sheet row index baris kosong */
    var rv = row.vals;
    all.headers.forEach(function(h, c){
      var v = (rv && rv[h] != null) ? String(rv[h]) : '';
      var isNum = /^\d+(\.\d+)?$/.test(v) && h !== 'Tanggal Input Reservasi';
      requests.push({
        updateCells:{
          rows:[{ values:[{ userEnteredValue: isNum ? { numberValue: Number(v) } : { stringValue: v } }] }],
          fields:'userEnteredValue',
          range:{ sheetId: iconsheet, startRowIndex: start, endRowIndex: start+1, startColumnIndex: c, endColumnIndex: c+1 }
        }
      });
    });
  } else if(mode === 'edit'){
    var eStart = row.rowIndex; // sudah offset (>=1)
    var rv = row.vals;
    all.headers.forEach(function(h, c){
      var v = (rv && rv[h] != null) ? String(rv[h]) : '';
      var isNum = /^\d+(\.\d+)?$/.test(v) && h !== 'Tanggal Input Reservasi';
      requests.push({
        updateCells:{
          rows:[{ values:[{ userEnteredValue: isNum ? { numberValue: Number(v) } : { stringValue: v } }] }],
          fields:'userEnteredValue',
          range:{ sheetId: iconsheet, startRowIndex: eStart, endRowIndex: eStart+1, startColumnIndex: c, endColumnIndex: c+1 }
        }
      });
    });
  } else if(mode === 'delete'){
    var dStart = row.rowIndex;
    requests.push({
      deleteDimension:{ range:{ sheetId: iconsheet, dimension:'ROWS', startIndex: dStart, endIndex: dStart+1 } }
    });
  }

  if(requests.length){
    await apiFetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+':batchUpdate', {
      method:'POST',
      headers:{ Authorization:'Bearer '+t, 'Content-Type':'application/json' },
      body: JSON.stringify({ requests: requests })
    });
  }
}

async function updateGoogleSheet(row, mode){
  var all = await readSheet();
  if(mode === 'add'){
    await applyMutations(all, { vals: row }, 'add');
  } else {
    var found = all.rows.some(function(r){ return String(r['No Row ID']) === String(row.rowId); });
    if(!found) throw new Error('Baris tidak ditemukan di sheet — refresh dulu lalu coba lagi');
    /* No Row ID = nomor baris sheet (1-based) -> 0-based sheet row index = id - 1 */
    var offset = parseInt(row.rowId, 10) - 1;
    if(!(offset >= 1)) throw new Error('Posisi baris tidak valid');
    await applyMutations(all, { vals: row.vals, rowId: row.rowId, rowIndex: offset }, mode);
  }
}

function donut(parts, size){

  if(!total) return '<div class="empty">Belum ada data</div>';

  var a0 = -Math.PI/2, segs = '';
  parts.forEach(function(p){
    var frac = p.value/total;
    var a1 = a0 + frac*Math.PI*2;
    var x0 = c + r*Math.cos(a0), y0 = c + r*Math.sin(a0);
    var x1 = c + r*Math.cos(a1), y1 = c + r*Math.sin(a1);
    var large = frac > 0.5 ? 1 : 0;
    segs += '<path d="M'+c+' '+c+' L'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+' Z" fill="'+p.color+'"/>';
    a0 = a1;
  });
  var lg = '<div class="legend">' + parts.map(function(p){
    var pct = Math.round(p.value/total*1000)/10;
    return '<div class="row"><span class="sw" style="background:'+p.color+'"></span>'+esc(p.label)+'<span class="num">'+nf(p.value)+' · '+pct+'%</span></div>';
  }).join('') + '</div>';
  var svg = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+segs+'<circle cx="'+c+'" cy="'+c+'" r="'+(r*0.62)+'" fill="#fff"/><text x="'+c+'" y="'+(c-4)+'" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">'+nf(total)+'</text><text x="'+c+'" y="'+(c+14)+'" text-anchor="middle" font-size="10.5" fill="#64748b">order</text></svg>';
  return '<div class="flex-split">'+svg+lg+'</div>';
}

function lineChart(points){
  if(!points.length) return '<div class="empty">Belum ada data</div>';
  var w = 640, h = 210, pad = 30;
  var max = 1; points.forEach(function(p){ max = Math.max(max, p.value); });
  var n = points.length;
  var x = function(i){ return n===1 ? w/2 : pad + i*(w-2*pad)/(n-1); };
  var y = function(v){ return h - pad - (v/max)*(h-2*pad); };
  var pts = points.map(function(p,i){ return x(i).toFixed(1)+','+y(p.value).toFixed(1); });
  var area = pad.toFixed(1)+','+(h-pad)+' ' + pts.join(' ') + ' ' + x(n-1).toFixed(1)+','+(h-pad);
  var dots = points.map(function(p,i){
    return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="3.6" fill="#4f46e5" stroke="#fff" stroke-width="2"/>';
  }).join('');
  var labels = points.map(function(p,i){
    return '<text x="'+x(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10.5" fill="#64748b">'+esc(monthLabel(p.label))+'</text>';
  }).join('');
  var vals = points.map(function(p,i){
    return '<text x="'+x(i).toFixed(1)+'" y="'+(y(p.value)-8)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">'+nf(p.value)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'
    + '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f46e5" stop-opacity=".25"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></linearGradient></defs>'
    + '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#e7e9ee"/>'
    + '<polygon points="'+area+'" fill="url(#ag)"/>'
    + '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots + labels + vals
    + '</svg>';
}

  var warn = ROWS.filter(function(r){ return agingClass(r)==='warn'; }).length;
  var ok = ROWS.filter(function(r){ return agingClass(r)==='ok'; }).length;

  var rows = sorted.map(function(r){
    var ac = agingClass(r);
    var cls = ac==='crit' ? 'row-crit' : (ac==='warn' ? 'row-warn' : '');
    var blockers = [];
    if(!r.hasPO) blockers.push('<span class="badge crit">tanpa PO</span>');
    if(!r.appr1) blockers.push('<span class="badge appr-no">appr.1 belum</span>');
    if(!r.appr2) blockers.push('<span class="badge appr-no">appr.2 belum</span>');
    var k = rowKey(r);
    return '<tr class="'+cls+'">'
      + '<td class="mono">'+(r.tgl?esc(r.tgl):'—')+'</td>'
      + '<td><span class="badge divi">'+esc(r.divisi)+'</span></td>'
      + '<td class="mono">'+(r.pr?esc(r.pr):'—')+'</td>'
      + '<td class="mono">'+(r.po?esc(r.po):'—')+'</td>'
      + '<td>'+esc((r.items[0]||'') )+(r.items.length>1 ? ' <span class="mini">+'+ (r.items.length-1) +' item</span>' : '')+'</td>'
      + '<td>'+agingBadge(r)+'</td>'
      + '<td>'+(blockers.length? blockers.join(' ') : '<span class="badge ok">lengkap</span>')+'</td>'
      + '<td><div style="display:flex;gap:6px">'
      + '<button class="btn-act edit" data-edit="'+esc(k)+'" title="Edit order">'+IC.edit+'</button>'
      + '<button class="btn-act del" data-del="'+esc(k)+'" title="Hapus order">'+IC.trash+'</button>'
      + '</div></td>'
      + '</tr>';
  }).join('');

  return '<section class="tab-page">'
    + '<div class="toolbar">'
    + '<div class="range-wrap"><label>Ambang warning:</label><input type="range" id="warnRange" min="1" max="30" value="'+state.warnTh+'"><span class="mini" id="warnRangeLbl">≥ '+state.warnTh+' hari</span><label>Ambang kritis:</label><input type="range" id="critRange" min="1" max="60" value="'+state.critTh+'"><span class="mini" id="critRangeLbl">≥ '+state.critTh+' hari</span></div>'
    + '</div>'
    + '<div class="grid cols-3" style="margin-bottom:16px">'
    + kpi(IC.alert, nf(crit), 'Kritis', 'umur ≥ '+state.critTh+' hari — segera follow-up', '#ef4444')
    + kpi(IC.clock, nf(warn), 'Warning', 'umur ≥ '+state.warnTh+' hari', '#f59e0b')
    + kpi(IC.check, nf(ok), 'Aman', 'umur < '+state.warnTh+' hari', '#10b981')
    + '</div>'
    + '<div class="card"><h3>Daftar Order Berdasarkan Umur (terlama dulu)</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Divisi</th><th>PR</th><th>PO</th><th>Barang</th><th>Umur</th><th>Blocker</th><th>Aksi</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    + '<p class="hint">Baris diurutkan dari umur terlama. Order lama ditandai kuning (warning) / merah (kritis); kolom "Blocker" menunjukkan alasan belum selesai (tanpa PO / approval belum).</p></div>'
    + '</section>';
}

function renderTable(){
  var q = state.q.toLowerCase();
  var rows = ROWS.filter(function(r){
    if(state.divFilter!=='all' && r.divisi!==state.divFilter) return false;
    if(state.stFilter!=='all' && r.status!==state.stFilter) return false;
    if(q){
      var hay = (r.divisi+' '+r.pr+' '+r.po+' '+r.jenis+' '+r.ket+' '+r.keperluan+' '+r.status).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  state.exportRows = rows;

  var srt = state;
  rows.sort(function(a,b){
    var ka, kb;
    switch(srt.sortKey){
      case 'tgl': ka = a.date? a.date.getTime():0; kb = b.date? b.date.getTime():0; break;
      case 'divisi': ka=a.divisi; kb=b.divisi; return ka.localeCompare(kb)*srt.sortDir;
      case 'pr': ka=parseInt(a.pr,10)||0; kb=parseInt(b.pr,10)||0; break;
      case 'po': ka=parseInt(a.po,10)||0; kb=parseInt(b.po,10)||0; break;
      case 'status': ka=a.status; kb=b.status; return ka.localeCompare(kb)*srt.sortDir;
      case 'age': ka=a.age==null?-1:a.age; kb=b.age==null?-1:b.age; break;
      default: ka=0; kb=0;
    }
    return (ka>kb?1:ka<kb?-1:0)*srt.sortDir;
  });

  var divOpts = ['<option value="all">Semua Divisi</option>'].concat(divisiList().map(function(d){ return '<option value="'+esc(d)+'"'+(state.divFilter===d?' selected':'')+'>'+esc(d)+'</option>'; })).join('');
  var stOpts = ['<option value="all">Semua Status</option>','<option value="Selesai">Selesai</option>','<option value="Menunggu Approval">Menunggu Approval</option>','<option value="Belum PO">Belum PO</option>'].map(function(s){
    var v=s.split('>')[0]; /* not used */
    return s.replace('<option ', '<option ').replace('>'+s.split('<option value="')[1].split('"')[0]+'<','>'+s.split('<option value="')[1].split('"')[0]+'<');
  }).join('');

  stOpts = '<option value="all"'+(state.stFilter==='all'?' selected':'')+'>Semua Status</option>'
    + '<option value="Selesai"'+(state.stFilter==='Selesai'?' selected':'')+'>Selesai</option>'
    + '<option value="Menunggu Approval"'+(state.stFilter==='Menunggu Approval'?' selected':'')+'>Menunggu Approval</option>'
    + '<option value="Belum PO"'+(state.stFilter==='Belum PO'?' selected':'')+'>Belum PO</option>';

  var arrow = function(k){ return state.sortKey===k ? (state.sortDir===1?' ▲':' ▼') : ''; };

  var trs = rows.map(function(r){
    var ac = agingClass(r);
    var cls = ac==='crit' ? 'row-crit' : (ac==='warn' ? 'row-warn' : '');
    var items = '<ul class="cellitems">'+r.items.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('')+'</ul>';
    var k = rowKey(r);
    var actBtns = '<td><div style="display:flex;gap:6px">'
      + '<button class="btn-act edit" data-edit="'+esc(k)+'" title="Edit order">'+IC.edit+'</button>'
      + '<button class="btn-act del" data-del="'+esc(k)+'" title="Hapus order">'+IC.trash+'</button>'
      + '</div></td>';
    return '<tr class="'+cls+'">'
      + '<td class="mono">'+(r.tgl?esc(r.tgl):'—')+'</td>'
      + '<td><span class="badge divi">'+esc(r.divisi)+'</span></td>'
      + '<td class="mono">'+(r.pr?esc(r.pr):'—')+'</td>'
      + '<td class="mono">'+(r.po?esc(r.po):'—')+'</td>'
      + '<td>'+items+'</td>'
      + '<td>'+apprBadge(r.a1, r.appr1)+'</td>'
      + '<td>'+apprBadge(r.a2, r.appr2)+'</td>'
      + '<td>'+statusBadge(r)+'</td>'
      + '<td>'+agingBadge(r)+'</td>'
      + '<td>'+esc(r.keperluan)+'</td>'
      + actBtns
      + '</tr>';
  }).join('');

  return '<section class="tab-page">'
    + '<div class="toolbar">'
    + '<div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="qInput" placeholder="Cari: PR, PO, barang, divisi…" value="'+esc(state.q)+'"></div>'
    + '<select class="select" id="divSel">'+divOpts+'</select>'
    + '<select class="select" id="stSel">'+stOpts+'</select>'
    + '<span class="count-pill">'+nf(rows.length)+' / '+nf(ROWS.length)+' baris</span>'
    + '</div>'
    + '<div class="tablewrap"><table>'
    + '<thead><tr>'
    + '<th class="sortable" data-k="tgl">Tanggal'+arrow('tgl')+'</th>'
    + '<th class="sortable" data-k="divisi">Divisi'+arrow('divisi')+'</th>'
    + '<th class="sortable" data-k="pr">Nomor PR'+arrow('pr')+'</th>'
    + '<th class="sortable" data-k="po">Nomor PO'+arrow('po')+'</th>'
    + '<th>Jenis Order (Barang)</th>'
    + '<th>Approval 1</th><th>Approval 2</th>'
    + '<th class="sortable" data-k="status">Status'+arrow('status')+'</th>'
    + '<th class="sortable" data-k="age">Umur'+arrow('age')+'</th>'
    + '<th>Keperluan</th>'
    + '<th>Aksi</th>'
    + '</tr></thead><tbody>'+(trs||'<tr><td colspan="11"><div class="empty">Tidak ada data cocok</div></td></tr>')+'</tbody></table></div>'
    + '</section>';
}

/* ============ RENDER SHELL ============ */
function renderNav(){
  var nav = document.getElementById('tabsNav');
  nav.innerHTML = TABS.map(function(t){
    return '<button class="tab'+(state.tab===t.id?' active':'')+'" data-tab="'+t.id+'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+t.icon+'</svg>'+t.label+'</button>';
  }).join('');
}

function render(){
  _dlist = null;
  renderNav();
  var main = document.getElementById('main');
  var html = '';
  switch(state.tab){
    case 'jenis': html = renderJenis(); break;
    case 'divisi': html = renderDivisi(); break;
    case 'status': html = renderStatus(); break;
    case 'aging': html = renderAging(); break;
    case 'tabel': html = renderTable(); break;
    default: html = renderOverview();
  }
  main.innerHTML = html;
  bindSection();
}

/* ============ EVENTS ============ */
function bindSection(){
  var nav = document.getElementById('tabsNav');
  Array.prototype.forEach.call(nav.querySelectorAll('.tab'), function(el){
    el.addEventListener('click', function(){
      state.tab = el.getAttribute('data-tab');
      render();
    });
  });

  document.querySelectorAll('.divi-card').forEach(function(el){
    el.addEventListener('click', function(){
      state.divFilter = el.getAttribute('data-d');
      state.tab = 'tabel';
      render();
      toast('Filter divisi: '+state.divFilter);
    });
  });

  var q = document.getElementById('qInput');
  if(q){ q.addEventListener('input', function(){ state.q=q.value; renderTableOnly(); }); }
  var ds = document.getElementById('divSel');
  if(ds){ ds.addEventListener('change', function(){ state.divFilter=ds.value; renderTableOnly(); }); }
  var ss = document.getElementById('stSel');
  if(ss){ ss.addEventListener('change', function(){ state.stFilter=ss.value; renderTableOnly(); }); }

  var ths = document.querySelectorAll('th.sortable');
  ths.forEach(function(th){
    th.addEventListener('click', function(){
      var k = th.getAttribute('data-k');
      if(state.sortKey===k) state.sortDir = -state.sortDir;
      else { state.sortKey=k; state.sortDir = k==='age'||k==='tgl' ? -1 : 1; }
      renderTableOnly();
    });
  });

  var wr = document.getElementById('warnRange');
  if(wr){
    wr.addEventListener('input', function(){
      state.warnTh = +wr.value;
      var c = document.getElementById('critRange');
      if(state.warnTh > state.critTh){ state.critTh = state.warnTh; c.value = state.critTh; }
      document.getElementById('warnRangeLbl').textContent = '≥ '+state.warnTh+' hari';
      document.getElementById('critRangeLbl').textContent = '≥ '+state.critTh+' hari';
      render();
    });
  }
  var cr = document.getElementById('critRange');
  if(cr){
    cr.addEventListener('input', function(){
      state.critTh = +cr.value;
      var w = document.getElementById('warnRange');
      if(state.critTh < state.warnTh){ state.warnTh = state.critTh; w.value = state.warnTh; }
      document.getElementById('warnRangeLbl').textContent = '≥ '+state.warnTh+' hari';
      document.getElementById('critRangeLbl').textContent = '≥ '+state.critTh+' hari';
      render();
    });
  }

  /* aksi edit/hapus per baris */
  document.querySelectorAll('[data-edit]').forEach(function(el){
    el.addEventListener('click', function(){ openEditModal(el.getAttribute('data-edit')); });
  });
  document.querySelectorAll('[data-del]').forEach(function(el){
    el.addEventListener('click', function(){ confirmDelete(el.getAttribute('data-del')); });
  });
}

function renderTableOnly(){
  var main = document.getElementById('main');
  if(state.tab==='tabel'){
    var q = document.getElementById('qInput') ? document.getElementById('qInput').value : state.q;
    state.q = q;
    main.innerHTML = renderTable();
    bindSection();
    /* fokus kembali ke input */
    var qi = document.getElementById('qInput');
    if(qi){ qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  }
}

/* ============ EXPORT ============ */
function exportCSV(){
  var rows = state.exportRows && state.exportRows.length ? state.exportRows : ROWS;
  var head = ['Tanggal','Divisi','Nomor PR','Nomor PO','Jenis Order','Approval 1','Approval 2','Status','Umur (hari)','Keterangan','Keperluan Order'];
  var lines = [head.join(',')];
  rows.forEach(function(r){
    var cells = [r.tgl, r.divisi, r.pr, r.po, r.jenis.replace(/\n+/g,'; '), r.a1, r.a2, r.status, r.age==null?'':r.age, r.ket, r.keperluan];
    lines.push(cells.map(function(c){
      c = String(c==null?'':c);
      return '"'+c.replace(/"/g,'""')+'"';
    }).join(','));
  });
  var blob = new Blob(["\uFEFF"+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'order-pr-po-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('CSV diekspor ('+rows.length+' baris)');
}

/* ============ TAMBAH / EDIT / HAPUS ============ */
var MODAL_ROWKEY = null;

function findRowByKey(k){
  var found = null;
  ROWS.forEach(function(r){ if(rowKey(r) === k) found = r; });
  return found;
}

function toggleModal(show, info){
  var back = document.getElementById('modalBack');
  back.style.display = show ? 'flex' : 'none';
  if(show){
    var note = document.getElementById('modalNote');
    var wrap = document.getElementById('fTokenWrap');
    if(info && info.note){
      note.innerHTML = info.note;
      note.style.display = 'block';
    } else {
      note.style.display = 'none';
    }
    wrap.style.display = 'block';
  }
}

function openAddModal(){
  MODAL_ROWKEY = null;
  document.getElementById('modalSave').dataset.mode = 'save';
  document.getElementById('modalTitle').textContent = 'Tambah Order';
  var today = new Date();
  var dd = String(today.getDate()).padStart(2,'0');
  var mm = String(today.getMonth()+1).padStart(2,'0');
  var yyyy = today.getFullYear();
  var vals = { fDivisi:'', fTgl: dd+'/'+mm+'/'+yyyy, fPr:'', fPo:'', fJenis:'', fA1:'Belum', fA2:'Belum', fKeperluan:'', fKet:'' };
  Object.keys(vals).forEach(function(id){ document.getElementById(id).value = vals[id]; });
  toggleModal(true, { note: 'Order baru akan ditulis <b>langsung ke spreadsheet</b> (tab "' + SHEET_NAME + '"). Pastikan Anda sudah login Google dan memberi izin akses saat diminta, atau tempel token pada kolom di bawah.' });
}

function openEditModal(k){
  var r = findRowByKey(k);
  if(!r){ toast('Baris tidak ditemukan'); return; }
  MODAL_ROWKEY = k;
  document.getElementById('modalSave').dataset.mode = 'save';
  document.getElementById('modalTitle').textContent = 'Edit Order';
  document.getElementById('fDivisi').value = r.divisi === 'Tanpa Divisi' ? '' : r.divisi;
  document.getElementById('fTgl').value = r.tgl || '';
  document.getElementById('fPr').value = r.pr || '';
  document.getElementById('fPo').value = r.po || '';
  document.getElementById('fJenis').value = (r.items || []).map(function(it){ return '- ' + it; }).join('\n');
  document.getElementById('fA1').value = r.a1 || '';
  document.getElementById('fA2').value = r.a2 || '';
  document.getElementById('fKeperluan').value = r.keperluan === '—' ? '' : r.keperluan;
  document.getElementById('fKet').value = r.ket || '';
  toggleModal(true, { note: 'Perubahan ditulis <b>langsung ke spreadsheet</b>. Baris: PR ' + (r.pr||'-') + ' / PO ' + (r.po||'-') + '.' });
}

function confirmDelete(k){
  var r = findRowByKey(k);
  if(!r){ toast('Baris tidak ditemukan'); return; }
  MODAL_ROWKEY = k;
  document.getElementById('modalSave').dataset.mode = 'delete';
  var back = document.getElementById('modalBack');
  var body = document.getElementById('modalBody');
  body.classList.add('hide-fields');
  document.getElementById('modalTitle').textContent = 'Hapus Order';
  var note = document.getElementById('modalNote');
  note.innerHTML = 'Yakin hapus baris <b>PR ' + (r.pr||'-') + ' / PO ' + (r.po||'-') + '</b> (' + r.divisi + ')? Baris akan <b>dihapus permanen</b> dari spreadsheet.';
  note.style.display = 'block';
  document.getElementById('modalSave').textContent = 'Ya, Hapus';
  document.getElementById('modalSave').className = 'btn-sm danger';
  back.style.display = 'flex';
}

function resetModalForm(){
  var body = document.getElementById('modalBody');
  body.classList.remove('hide-fields');
  document.getElementById('modalSave').textContent = 'Simpan';
  document.getElementById('modalSave').className = 'btn-sm prim';
  document.getElementById('fTokenWrap').style.display = 'none';
  var note = document.getElementById('modalNote');
  note.style.display = 'none';
}

function closeModal(){
  document.getElementById('modalBack').style.display = 'none';
  MODAL_ROWKEY = null;
  resetModalForm();
}

function buildVals(forToken){
  var v = {};
  v['Divisi'] = document.getElementById('fDivisi').value.trim();
  v['Tanggal Input Reservasi'] = document.getElementById('fTgl').value.trim();
  v['Nomor PR'] = document.getElementById('fPr').value.trim();
  v['Nomor PO'] = document.getElementById('fPo').value.trim();
  v['Jenis Order'] = document.getElementById('fJenis').value.replace(/^\s*-\s*/gm, '').trim();
  v['Approval 1'] = document.getElementById('fA1').value.trim();
  v['Approval 2'] = document.getElementById('fA2').value.trim();
  v['Keperluan Order'] = document.getElementById('fKeperluan').value.trim();
  v['Keterangan'] = document.getElementById('fKet').value.trim();
  return v;
}

async function handleSave(){
  var saveBtn = document.getElementById('modalSave');
  if(saveBtn.dataset.mode === 'delete'){
    var r = findRowByKey(MODAL_ROWKEY);
    if(!r){ toast('Baris tidak ditemukan'); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Menghapus…';
    try{
      await updateGoogleSheet({ rowId: rowKey(r) }, 'delete');
      toast('Order dihapus dari spreadsheet');
      closeModal();
      refresh();
    }catch(e){
      alert('Gagal menghapus: ' + (e && e.message || e));
      saveBtn.disabled = false; saveBtn.textContent = 'Ya, Hapus';
    }
    return;
  }

  var vals = buildVals();
  var isEdit = !!MODAL_ROWKEY;

  saveBtn.disabled = true; saveBtn.textContent = 'Menyimpan…';
  try{
    if(isEdit){
      await updateGoogleSheet({ rowId: MODAL_ROWKEY, vals: vals }, 'edit');
      toast('Order diperbarui di spreadsheet');
    } else {
      await updateGoogleSheet({ vals: vals }, 'add');
      toast('Order ditambahkan ke spreadsheet');
    }
    closeModal();
    refresh();
  }catch(e){
    var msg = e && e.message ? e.message : e;
    var action = isEdit ? 'memperbarui' : 'menambah';
    alert('Gagal ' + action + ': ' + msg + '\n\nPenyebab umum: (1) token belum diisi / kedaluwarsa, (2) OAuth scope spreadsheet belum diizinkan, (3) file sheet tidak dibagikan sebagai Editor bagi akun Anda.');
    saveBtn.disabled = false; saveBtn.textContent = 'Simpan';
  }
}

/* ============ INIT ============ */
document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('exportBtn').addEventListener('click', exportCSV);
document.getElementById('syncBannerClose').addEventListener('click', hideSyncBanner);
document.getElementById('addBtn').addEventListener('click', openAddModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalBack').addEventListener('click', function(e){ if(e.target === this) closeModal(); });
document.getElementById('modalSave').addEventListener('click', handleSave);

/* --- PWA: tombol install & service worker --- */
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  var b = document.getElementById('installBtn');
  b.style.display = 'inline-flex';
  b.addEventListener('click', function(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; b.style.display = 'none'; });
  });
});
window.addEventListener('appinstalled', function(){
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
  toast('Dashboard terpasang sebagai aplikasi');
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* SW opsional */ });
  });
}

document.getElementById('autoSync').addEventListener('change', function(e){
  clearInterval(AUTO_TIMER); AUTO_TIMER = null;
  if(e.target.checked){
    AUTO_TIMER = setInterval(function(){ refresh(); }, 5*60*1000);
    toast('Auto-sync aktif (tiap 5 menit)');
  } else {
    toast('Auto-sync nonaktif');
  }
});

/* init dengan snapshot dulu agar cepat tampil */
var _subEl = document.querySelector('.brand .sub');
if(_subEl) _subEl.textContent = 'Bahan & Spareparts · Sheet "' + SHEET_NAME + '" · Auto-sync';
setRows(loadFromSnapshot(), false, null);
/* muat Google API client (untuk tulis ke spreadsheet via OAuth) — opsional, tidak memblokir render */
try{ loadGapi(); }catch(e){}
/* jalankan auto-sync STARTUP (default ON karena checkbox checked) */
if(document.getElementById('autoSync').checked){
  AUTO_TIMER = setInterval(function(){ refresh(); }, 5*60*1000);
}
refresh(); /* lalu coba live segera */

/* update service worker jika versi baru tersedia */
if('serviceWorker' in navigator && navigator.serviceWorker.controller){
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    /* versi baru aktif -> reload agar frame html terbaru */
    if(!location.hash) location.reload();
  });
}

})();
